<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>1番線 再生中</title>
<style>
body{
  text-align:center;
  background:black;
  color:white;
  margin-top:40px;
  font-family:sans-serif;
}
img{
  width:90%;
  max-width:600px;
}
.big{
  font-size:60px;
  margin:30px;
}
</style>
</head>
<body>

<img src="IMG_1106.jpeg">

<div class="big">1番線 再生中</div>

<audio id="melody" src="kimitsu123.mp4"></audio>

<script>
const melody=document.getElementById("melody");

function loop(){
  melody.currentTime=6;
  melody.play();
  setInterval(()=>{
    if(melody.currentTime>=28){
      melody.currentTime=6;
    }
  },100);
}

loop();
</script>

</body>
</html>
