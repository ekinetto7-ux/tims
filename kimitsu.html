<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>1番線</title>
</head>

<body style="margin:0;background:black;color:white;font-family:sans-serif;text-align:center;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;">

<h1 style="font-size:40px;margin-bottom:40px;">1番線</h1>

<div>
<button onclick="startSound()" style="padding:15px 40px;margin:10px;border:none;border-radius:30px;font-size:18px;background:#666;color:white;">
ON
</button>

<button onclick="stopSound()" style="padding:15px 40px;margin:10px;border:none;border-radius:30px;font-size:18px;background:#444;color:white;">
OFF
</button>
</div>

<audio id="melody" src="kimitsu123.mp4"></audio>

<script>
const melody=document.getElementById("melody");
let loop;

function startSound(){
  melody.currentTime=6;
  melody.play();
  loop=setInterval(()=>{
    if(melody.currentTime>=28){
      melody.currentTime=6;
    }
  },100);
}

function stopSound(){
  clearInterval(loop);
  melody.pause();
}
</script>

</body>
</html>
