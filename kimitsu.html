<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>君津駅 1番線</title>
</head>

<body style="margin:0;
background:#0b1633;
font-family:sans-serif;
text-align:center;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;">

<h1 style="font-size:32px;margin-bottom:60px;">
君津駅 1番線
</h1>

<button onclick="startSound()" 
style="width:70%;
max-width:400px;
padding:20px;
font-size:22px;
border:none;
border-radius:25px;
background:#2ecc71;
color:black;
margin-bottom:40px;">
ON
</button>

<button onclick="stopSound()" 
style="width:70%;
max-width:400px;
padding:20px;
font-size:22px;
border:none;
border-radius:25px;
background:#e74c3c;
color:white;">
OFF
</button>

<audio id="melody" src="kimitsu123.mp4"></audio>

<script>
const melody=document.getElementById("melody");
let loop;

function startSound(){
  melody.currentTime=6;
  melody.muted=false;
  melody.play().then(()=>{
    loop=setInterval(()=>{
      if(melody.currentTime>=28){
        melody.currentTime=6;
      }
    },100);
  }).catch(error=>{
    alert("再生できません");
  });
}

function stopSound(){
  clearInterval(loop);
  melody.pause();
}
</script>
