<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>君津駅 番線選択</title>
</head>

<body style="
margin:0;
background:#0b1633;
font-family:sans-serif;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
">

<h1 style="font-size:34px;margin-bottom:60px;">
君津駅 番線選択
</h1>

<button onclick="go(1)" style="
width:85%;
max-width:500px;
padding:30px;
font-size:28px;
border:none;
border-radius:30px;
background:#3498db;
color:white;
margin:20px 0;
">
1番線
</button>

<button onclick="go(2)" style="
width:85%;
max-width:500px;
padding:30px;
font-size:28px;
border:none;
border-radius:30px;
background:#3498db;
color:white;
margin:20px 0;
">
2番線
</button>

<button onclick="go(3)" style="
width:85%;
max-width:500px;
padding:30px;
font-size:28px;
border:none;
border-radius:30px;
background:#3498db;
color:white;
margin:20px 0;
">
3番線
</button>

<script>
function go(num){
  if(num===1){ window.location.href="kimitsu.html"; }
  if(num===2){ window.location.href="kimitsu2.html"; }
  if(num===3){ window.location.href="kimitsu3.html"; }
}
</script>
