<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>試聴 - 生物交通チャンネル</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f4f8; text-align: center; padding: 40px; color: #333; }
        .player-card { background: white; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; }
        .song-title { font-weight: bold; margin-bottom: 5px; text-align: left; }
        audio { margin-bottom: 30px; width: 100%; }
        .divider { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        .back-btn { 
            display: inline-block; 
            margin-top: 20px;
            padding: 10px 20px; 
            background-color: #718096; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
        }
        .back-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>楽曲試聴</h2>
