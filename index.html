<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピクミン タイピング大作戦 - ログイン＆ホーム画面</title>
    <style>
        :root {
            --bg-dark: #091315;
            --panel-bg: rgba(20, 38, 42, 0.9);
            --accent-green: #2ed573;
            --accent-gold: #ffa502;
            --accent-red: #ff4757;
            --accent-blue: #1e90ff;
            --text-main: #f1f2f6;
            --text-sub: #a4b0be;
            --border-glow: rgba(46, 213, 115, 0.3);
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at top, #183a3d 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--accent-gold);
            text-shadow: 0 0 25px rgba(255, 165, 2, 0.7);
            font-size: 28px;
            margin: 10px 0 5px;
            text-align: center;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px var(--border-glow);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 25px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent-green), #219d53);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
            margin: 5px;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.5);
        }
        .btn-ai {
            background: linear-gradient(135deg, var(--accent-red), #c0392b);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }
        .btn-sub {
            background: linear-gradient(135deg, #3742fa, #2f3542);
            width: auto;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: rgba(10, 20, 22, 0.9);
            border: 2px solid #2f3640;
            color: #fff;
            border-radius: 8px;
            margin-top: 8px;
            margin-bottom: 15px;
            outline: none;
            transition: 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(255, 165, 2, 0.3);
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .stat-card {
            background: rgba(10, 20, 22, 0.7);
            padding: 10px 12px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-gold);
        }
        .stat-label { font-size: 11px; color: var(--text-sub); }
        .stat-val { font-size: 18px; font-weight: bold; color: #fff; margin-top: 3px; }
        
        .battle-arena {
            background: rgba(8, 16, 18, 0.85);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        .target-kanji { font-size: 32px; font-weight: bold; color: var(--accent-gold); margin: 10px 0 5px; }
        .target-kana { font-size: 16px; color: var(--accent-green); letter-spacing: 2px; margin-bottom: 5px; }
        .target-roman { font-size: 14px; color: var(--text-sub); font-family: monospace; margin-bottom: 15px; }
        
        .hp-bar-container {
            width: 100%;
            background: #1e272e;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            margin: 8px 0 16px;
            border: 1px solid #353b48;
        }
        .hp-bar { height: 100%; transition: width 0.3s ease; }
        .hp-player { background: linear-gradient(90deg, #2ed573, #7bed9f); }
        .hp-ai { background: linear-gradient(90deg, #ff4757, #ff6b81); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🌿 ピクミン タイピング大作戦</h1>
    <div class="subtitle">4K Visual Edition — 認証・セーブシステム</div>

    <!-- ================= 1. ログイン・新規登録画面 ================= -->
    <div class="container" id="authScreen">
        <h3>🔐 隊員認証システム</h3>
        <p style="font-size: 13px; color: var(--text-sub);">初めての方は登録、すでにお持ちの方はログインしてください。</p>
        
        <label style="font-size: 13px; color: var(--text-sub);">プレイヤー名（ID）</label>
        <input type="text" id="authName" placeholder="例: 主人公隊長">

        <label style="font-size: 13px; color: var(--text-sub);">パスワード</label>
        <input type="password" id="authPass" placeholder="パスワードを入力">

        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button class="btn" onclick="handleRegister()">📝 新規登録して始める</button>
            <button class="btn" style="background: linear-gradient(135deg, var(--accent-blue), #0056b3);" onclick="handleLogin()">🔑 ログイン</button>
        </div>
        <div id="authMsg" style="margin-top: 12px; font-size: 13px; color: var(--accent-gold); text-align: center;"></div>
    </div>

    <!-- ================= 2. ホーム画面（ロビー） ================= -->
    <div class="container hidden" id="homeScreen">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <h3 style="margin: 0;">🏠 ホーム画面（ロビー）</h3>
            <button class="btn btn-sub" style="padding: 6px 12px; font-size: 12px;" onclick="logout()">ログアウト</button>
        </div>

        <div class="status-grid">
            <div class="stat-card">
                <div class="stat-label">ログイン隊長</div>
                <div class="stat-val" id="homeName">-</div>
            </div>
            <div class="stat-card" style="border-color: var(--accent-green);">
                <div class="stat-label">ピクミン隊列数</div>
                <div class="stat-val" id="homePikmin">0 匹</div>
            </div>
            <div class="stat-card" style="border-color: var(--accent-blue);">
                <div class="stat-label">累計スコア</div>
                <div class="stat-val" id="homeScore">0 pt</div>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">

        <h3 style="margin-top: 0;">🎮 モード選択</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" onclick="startPlay('solo')">🌱 一人プレイ（原生生物討伐）</button>
            <button class="btn btn-ai" onclick="startPlay('ai')">🔥 AI対戦（ルーイAIとスピード対決）</button>
        </div>
    </div>

    <!-- ================= 3. ゲームプレイ画面 ================= -->
    <div class="container hidden" id="gameScreen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="gameModeTitle" style="font-weight: bold; color: var(--accent-gold); font-size: 16px;">🌱 モード</span>
            <button class="btn btn-sub" style="padding: 6px 14px; font-size: 13px;" onclick="backToHome()">← ホームへ戻る</button>
        </div>

        <div id="gaugeSection">
            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                <span id="p1Label">あなたの討伐ゲージ</span>
                <span id="p1ScoreText">0 / 1000</span>
            </div>
            <div class="hp-bar-container">
                <div class="hp-bar hp-player" id="p1Bar" style="width: 0%;"></div>
            </div>

            <div id="aiGaugeWrapper" class="hidden">
                <div style="display: flex; justify-content: space-between; font-size: 13px; color: #ff6b81;">
                    <span>🤖 ルーイAI</span>
                    <span id="aiScoreText">0 / 1000</span>
                </div>
                <div class="hp-bar-container">
                    <div class="hp-bar hp-ai" id="aiBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="battle-arena">
            <div style="font-size: 13px; color: var(--text-sub);">出現したお題</div>
            <div class="target-kanji" id="wordKanji">チャッピー</div>
            <div class="target-kana" id="wordKana">ちゃっぴー</div>
            <div class="target-roman" id="wordRoman">chappi- / tyappi-</div>

            <input type="text" id="typingBox" placeholder="ローマ字で入力..." autocomplete="off" oninput="handleTyping()" style="margin-bottom: 0;">
            <div id="feedbackMsg" style="margin-top: 10px; font-size: 14px; color: var(--accent-green); min-height: 20px;"></div>
        </div>
    </div>

    <!-- 効果音 -->
    <audio id="hitSound" src="d.mp3" preload="auto"></audio>

    <script>
        // ==========================================
        // 🔐 認証・セーブ管理システム
        // ==========================================
        let currentUser = null; // 現在ログイン中のユーザーデータ

        function getAllUsers() {
            try {
                return JSON.parse(localStorage.getItem('pikmin_all_users') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveAllUsers(users) {
            localStorage.setItem('pikmin_all_users', JSON.stringify(users));
        }

        function handleRegister() {
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const msg = document.getElementById('authMsg');

            if (!name || !pass) {
                msg.style.color = "var(--accent-red)";
                msg.innerText = "⚠️ 名前とパスワードを入力してください！";
                return;
            }

            let users = getAllUsers();
            if (users[name]) {
                msg.style.color = "var(--accent-red)";
                msg.innerText = "⚠️ その名前はすでに登録されています（ログインしてください）";
                return;
            }

            // 新規アカウント作成
            users[name] = {
                password: pass,
                pikmin: 10,
                score: 0
            };
            saveAllUsers(users);

            currentUser = { name: name, data: users[name] };
            msg.style.color = "var(--accent-green)";
            msg.innerText = "✨ 登録成功！ ホーム画面へ移動します...";
            setTimeout(goToHome, 800);
        }

        function handleLogin() {
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const msg = document.getElementById('authMsg');

            if (!name || !pass) {
                msg.style.color = "var(--accent-red)";
                msg.innerText = "⚠️ 名前とパスワードを入力してください！";
                return;
            }

            let users = getAllUsers();
            if (!users[name]) {
                msg.style.color = "var(--accent-red)";
                msg.innerText = "⚠️ その名前のユーザーは見つかりません（新規登録してください）";
                return;
            }

            if (users[name].password !== pass) {
                msg.style.color = "var(--accent-red)";
                msg.innerText = "❌ パスワードが間違っています！";
                return;
            }

            currentUser = { name: name, data: users[name] };
            msg.style.color = "var(--accent-green)";
            msg.innerText = "🔓 ログイン成功！ ホーム画面へ移動します...";
            setTimeout(goToHome, 800);
        }

        function logout() {
            currentUser = null;
            document.getElementById('authName').value = "";
            document.getElementById('authPass').value = "";
            document.getElementById('authMsg').innerText = "";
            
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function goToHome() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            updateHomeUI();
        }

        function updateHomeUI() {
            if (!currentUser) return;
            document.getElementById('homeName').innerText = currentUser.name;
            document.getElementById('homePikmin').innerText = `${currentUser.data.pikmin.toLocaleString()} 匹`;
            document.getElementById('homeScore').innerText = `${currentUser.data.score.toLocaleString()} pt`;
            
            // データを自動保存（全ユーザーデータも更新）
            let users = getAllUsers();
            users[currentUser.name] = currentUser.data;
            saveAllUsers(users);
        }

        // ==========================================
        // ⌨️ ゲームロジック
        // ==========================================
        const wordList = [
            { kanji: "赤ピクミン", kana: "あかぴくみん", patterns: ["akapikumin", "akapikuminn"] },
            { kanji: "青ピクミン", kana: "あおぴくみん", patterns: ["aopikumin", "aopikuminn"] },
            { kanji: "黄ピクミン", kana: "きぴくみん", patterns: ["kipikumin", "kipikuminn"] },
            { kanji: "チャッピー", kana: "ちゃっぴー", patterns: ["chappi-", "tyappi-"] },
            { kanji: "通信機", kana: "つうしんき", patterns: ["tsuushinki", "tuushinki", "tuusinki", "tsuusinki"] },
            { kanji: "オニヨン", kana: "おによん", patterns: ["oniyon", "oniyonn"] },
            { kanji: "ドルフィン号", kana: "どるふぃんごう", patterns: ["dorufingou", "doruhwingou"] },
            { kanji: "ペレット草", kana: "ぺれっとそう", patterns: ["perettosou"] }
        ];

        let playMode = 'solo';
        let currentWord = null;
        let myPoints = 0;
        let aiPoints = 0;
        const GOAL = 1000;
        let aiTimer = null;

        function startPlay(mode) {
            playMode = mode;
            myPoints = 0;
            aiPoints = 0;

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            if (mode === 'ai') {
                document.getElementById('gameModeTitle').innerText = "🔥 AI対戦：vs ルーイAI";
                document.getElementById('aiGaugeWrapper').classList.remove('hidden');
                startAi();
            } else {
                document.getElementById('gameModeTitle').innerText = "🌱 一人プレイ：原生生物討伐";
                document.getElementById('aiGaugeWrapper').classList.add('hidden');
            }

            updateGauges();
            nextWord();
            const box = document.getElementById('typingBox');
            box.value = "";
            box.focus();
        }

        function backToHome() {
            clearInterval(aiTimer);
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            updateHomeUI();
        }

        function nextWord() {
            const idx = Math.floor(Math.random() * wordList.length);
            currentWord = wordList[idx];
            document.getElementById('wordKanji').innerText = currentWord.kanji;
            document.getElementById('wordKana').innerText = currentWord.kana;
            document.getElementById('wordRoman').innerText = currentWord.patterns.join(" / ");
        }

        function handleTyping() {
            const input = document.getElementById('typingBox');
            const val = input.value.toLowerCase().trim();
            const fb = document.getElementById('feedbackMsg');

            if (!currentWord) return;

            if (currentWord.patterns.includes(val)) {
                playHitSound();
                myPoints += 200;
                currentUser.data.score += 200;
                currentUser.data.pikmin += 2;
                updateHomeUI();

                fb.innerText = `✨ 撃破！ ピクミンが2匹増えた！`;
                input.value = "";
                updateGauges();

                if (myPoints >= GOAL) {
                    endGame(true);
                } else {
                    nextWord();
                }
            } else {
                const isPrefix = currentWord.patterns.some(p => p.startsWith(val));
                if (val === "") {
                    fb.innerText = "";
                } else if (isPrefix) {
                    fb.style.color = "var(--accent-green)";
                    fb.innerText = "🌿 突撃中...";
                } else {
                    fb.style.color = "var(--accent-red)";
                    fb.innerText = "⚠️ スペル違い";
                }
            }
        }

        function startAi() {
            clearInterval(aiTimer);
            aiTimer = setInterval(() => {
                aiPoints += 120;
                updateGauges();
                if (aiPoints >= GOAL) {
                    endGame(false);
                }
            }, 2800);
        }

        function updateGauges() {
            const p1Pct = Math.min(100, (myPoints / GOAL) * 100);
            document.getElementById('p1Bar').style.width = p1Pct + "%";
            document.getElementById('p1ScoreText').innerText = `${myPoints} / ${GOAL}`;

            const aiPct = Math.min(100, (aiPoints / GOAL) * 100);
            document.getElementById('aiBar').style.width = aiPct + "%";
            document.getElementById('aiScoreText').innerText = `${aiPoints} / ${GOAL}`;
        }

        function endGame(isWin) {
            clearInterval(aiTimer);
            if (playMode === 'ai') {
                if (isWin) {
                    currentUser.data.score += 500;
                    currentUser.data.pikmin += 10;
                    updateHomeUI();
                    alert("🏆 勝利！ ルーイAIに勝ち、ボーナス獲得！");
                } else {
                    alert("💀 敗北... AIに先にゴールされた！");
                }
            } else {
                currentUser.data.score += 300;
                updateHomeUI();
                alert("🎉 クリア！ 原生生物をすべて討伐しました！");
            }
            backToHome();
        }

        function playHitSound() {
            const audio = document.getElementById('hitSound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }
    </script>
</body>
</html>
