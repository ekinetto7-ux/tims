<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMAND CENTER 01</title>
    <style>
        body { background: #050505; color: #eee; font-family: sans-serif; margin: 0; padding: 10px; }
        .banner { background: #cc0000; padding: 20px; font-weight: bold; text-align: center; border: 3px solid #fff; font-size: 1.4rem; }
        .panel { border: 1px solid #333; padding: 15px; margin-top: 15px; background: #111; border-radius: 8px; }
        h3 { color: #00ff41; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .btn { display: block; width: 100%; padding: 18px; background: #222; color: #fff; text-decoration: none; text-align: center; border: 1px solid #444; margin-top: 8px; font-weight: bold; border-radius: 5px; }
        .admin-panel { border: 2px dashed #00ff41; padding: 15px; margin-top: 20px; background: #001100; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #333; border-radius: 3px; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #00ff41; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="banner" id="status">【待機中】最新状況を確認せよ</div>

    <div class="admin-panel">
        <h3>[ADMIN] 司令官認証コード</h3>
        <input type="password" id="pass" placeholder="PASSWORD">
        <input type="text" id="evac" placeholder="避難状況を入力">
        <input type="text" id="place" placeholder="停電場所">
        <input type="text" id="cause" placeholder="停電原因">
        <input type="text" id="time" placeholder="復旧予想時間">
        <button onclick="updateAll()">全域データを同期</button>
    </div>

    <div class="panel" style="border: 1px solid #ffff00;">
        <h3 style="color: #ffff00;">⚡ 停電状況詳細</h3>
        <div id="disp-place">場所：未確認</div>
        <div id="disp-cause">原因：未確認</div>
        <div id="disp-time">復旧予想：未確認</div>
    </div>

    <div class="panel">
        <h3>🚨 リアルタイム監視リンク</h3>
        <a class="btn" href="https://teideninfo.tepco.co.jp/" target="_blank">停電情報マップ（東電）</a>
        <a class="btn" href="https://www.river.go.jp/" target="_blank">河川水位・氾濫情報</a>
        <a class="btn" href="https://www.traininfo.jreast.co.jp/train_info/kanto.aspx" target="_blank">JR内房線 運行状況</a>
        <a class="btn" href="https://www.jma.go.jp/bosai/nowc/" target="_blank">雨雲レーダー（気象庁）</a>
    </div>

    <script>
        function updateAll() {
            if(document.getElementById('pass').value === "20201002") {
                document.getElementById('status').innerText = document.getElementById('evac').value;
                document.getElementById('disp-place').innerText = "場所：" + document.getElementById('place').value;
                document.getElementById('disp-cause').innerText = "原因：" + document.getElementById('cause').value;
                document.getElementById('disp-time').innerText = "復旧予想：" + document.getElementById('time').value;
            } else {
                alert("認証失敗：権限がありません");
            }
        }
    </script>
</body>
</html>
