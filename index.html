<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>君津駅</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

<h1>君津駅</h1>
<h2 id="display">番線未選択</h2>

<button onclick="playTrack(1)">1番線</button>
<button onclick="playTrack(2)">2番線</button>
<button onclick="playTrack(3)">3番線</button>
<button onclick="stopAndDoor()">OFF</button>

<audio id="melody" src="kimitsu123.mp4"></audio>

<script>
const melody = document.getElementById("melody");
const display = document.getElementById("display");
let currentTrack = 0;
let loop;

function playSection(start,end){
  clearInterval(loop);
  melody.currentTime = start;
  melody.play();

  loop = setInterval(function(){
    if(melody.currentTime >= end){
      melody.currentTime = start;
    }
  },100);
}

function playTrack(track){
  currentTrack = track;
  display.textContent = track + "番線";

  if(track==1){ playSection(0,28); }
  if(track==2){ playSection(46,71); }
  if(track==3){ playSection(175,216); }
}

function stopAndDoor(){
  clearInterval(loop);
  melody.pause();

  if(currentTrack==1){
    melody.currentTime=29;
    melody.play();
    setTimeout(()=>melody.pause(),10000);
  }
}
</script>

</body>
</html>
