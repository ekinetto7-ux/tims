<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR車両編成総合データベース</title>
    <style>
        :root { --jr-east: #22ac38; --jr-central: #ff7e00; --jr-west: #0072bc; --dark-bg: #1a1a1a; --keiyo-color: #c9222b; --sobu-color: #003399; }
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; color: #333; }
        .portal-header { background-color: var(--dark-bg); color: #ffffff; padding: 40px 20px; text-align: center; border-bottom: 5px solid #737373; }
        .portal-header h1 { margin: 0; font-size: 32px; font-weight: bold; }
        .portal-header p { margin: 10px 0 0 0; font-size: 14px; color: #aaa; letter-spacing: 4px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .jr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .jr-card { background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card-header { padding: 15px 20px; color: #ffffff; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .card-header .logo-text { font-size: 24px; font-weight: 900; font-style: italic; }
        .east { background-color: var(--jr-east); }
        .card-body { padding: 20px; flex-grow: 1; }
        .card-body p { margin: 0 0 15px 0; font-size: 14px; color: #666; }
        .route-link { display: block; background: #f8f9fa; border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 10px; border-radius: 5px; text-decoration: none; color: #333; font-weight: bold; font-size: 14px; border-left: 5px solid #737373; }
        .route-link:hover { background: #f1f3f5; }
        .link-je { border-left-color: var(--keiyo-color); }
        .link-jo { border-left-color: var(--sobu-color); }
    </style>
</head>
<body>
    <div class="portal-header"><h1>🚉 JR車両編成 総合データベース</h1><p>JAPAN RAILWAYS ROSTER PORTAL</p></div>
    <div class="container">
        <div class="section-title">🏢 鉄道会社を選択</div>
        <div class="jr-grid">
            <div class="jr-card">
                <div class="card-header east"><span>JR東日本</span><span class="logo-text">JR</span></div>
                <div class="card-body">
                    <p>首都圏エリアや新幹線、東北・信越地方の車両データベースです。</p>
                    <a href="keiyo.html" class="route-link link-je">JE 京葉線 (E233系5000番台)</a>
                    <a href="sobu.html" class="route-link link-jo">JO 総武・横須賀線 (E235系1000番台)</a>
                </div>
            </div>
            <div class="jr-card"><div class="card-header central" style="background:#ff7e00;"><span>JR東海</span><span class="logo-text">JR</span></div><div class="card-body"><p>東海道新幹線や名古屋・静岡エリアを走る車両のデータベースです。</p><div style="color: #999; font-size: 14px; font-style: italic; padding: 10px 0;">順次追加予定</div></div></div>
            <div class="jr-card"><div class="card-header west" style="background:#0072bc;"><span>JR西日本</span><span class="logo-text">JR</span></div><div class="card-body"><p>アーバンネットワークや山陽・北陸エリアの車両データベースです。</p><div style="color: #999; font-size: 14px; font-style: italic; padding: 10px 0;">順次追加予定</div></div></div>
        </div>
    </div>
</body>
</html>
