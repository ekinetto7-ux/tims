<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駅発車システム</title>

<style>
body{
  text-align:center;
  font-family:sans-serif;
  background:#f2f2f2;
  margin-top:40px;
}

h1{
  font-size:28px;
}

select, button{
  margin:6px;
  padding:8px 15px;
  border-radius:20px;
  border:none;
  background:#ddd;
  font-size:14px;
}

button{
  cursor:pointer;
}

.big{
  font-size:48px;
  margin:30px;
}
</style>
</head>

<body>

<h1>駅発車メロディー</h1>

<!-- 会社 -->
<select id="company" onchange="updateLine()">
<option value="">会社選択</option>
<option value="jr">JR東日本</option>
</select>

<!-- 路線 -->
<select id="line" onchange="updateStation()" disabled>
<option value="">路線選択</option>
</select>

<!-- 駅 -->
<select id="station" disabled>
<option value="">駅選択</option>
</select>

<div class="big" id="display">未選択</div>

<br>

<button onclick="playTrack(1)">1番線</button>
<button onclick="playTrack(2)">2番線</button>
<button onclick="playTrack(3)">3番線</button>
<button onclick="stopSound()">OFF</button>

<audio id="melody" src="kimitsu123.mp4"></audio>

<script>
const lineSelect = document.getElementById("line");
const stationSelect = document.getElementById("station");
const display = document.getElementById("display");
const melody = document.getElementById("melody");

let currentTrack = 0;
let loop;

// 会社→路線
function updateLine(){
  const company = document.getElementById("company").value;

  lineSelect.innerHTML = "<option value=''>路線選択</option>";
  stationSelect.innerHTML = "<option value=''>駅選択</option>";

  stationSelect.disabled = true;

  if(company === "jr"){
    lineSelect.disabled = false;
    lineSelect.innerHTML += "<option value='uchibo'>内房線</option>";
  }else{
    lineSelect.disabled = true;
  }
}

// 路線→駅
function updateStation(){
  const line = lineSelect.value;

  stationSelect.innerHTML = "<option value=''>駅選択</option>";

  if(line === "uchibo"){
    stationSelect.disabled = false;
    stationSelect.innerHTML += "<option value='kimitsu'>君津駅</option>";
  }else{
    stationSelect.disabled = true;
  }
}

// 音ループ
function playSection(start,end){
  clearInterval(loop);
  melody.currentTime = start;
  melody.play();

  loop = setInterval(()=>{
    if(melody.currentTime >= end){
      melody.currentTime = start;
    }
  },100);
}

// 番線再生
function playTrack(track){

  const company = document.getElementById("company").value;
  const line = lineSelect.value;
  const station = stationSelect.value;

  if(!company || !line || !station){
    alert("会社→路線→駅を選択してください");
    return;
  }

  currentTrack = track;
  display.textContent = track + "番線";

  if(track===1){ playSection(0,28); }
  if(track===2){ playSection(46,71); }
  if(track===3){ playSection(175,216); }
}

// 停止
function stopSound(){
  clearInterval(loop);
  melody.pause();
}
</script>

</body>
</html>
