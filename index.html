<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機捜210 - FREEDOM CHASE TYPING</title>
    <style>
        :root {
            --bg-color: #050811;
            --panel-bg: rgba(10, 16, 30, 0.9);
            --neon-cyan: #00f3ff;
            --neon-red: #ff0055;
            --neon-yellow: #ffe600;
            --text-color: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 850px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        h1 {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 12px;
            background: #000;
            border: 2px solid var(--neon-cyan);
            color: #fff;
            font-size: 1.1rem;
            border-radius: 6px;
            margin: 10px 0;
            text-align: center;
            outline: none;
        }

        button {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin: 8px;
            transition: 0.2s;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* --- 動くパトカー（CSS完全描画） --- */
        .patcar-container {
            position: relative;
            width: 140px;
            height: 70px;
            margin: 15px auto;
            animation: drive 1.2s infinite ease-in-out;
        }

        @keyframes drive {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .siren-box {
            position: absolute;
            top: 2px;
            left: 55px;
            width: 30px;
            height: 8px;
            display: flex;
            justify-content: space-between;
        }

        .siren-light {
            width: 12px;
            height: 100%;
            border-radius: 3px 3px 0 0;
        }

        .siren-red {
            background: var(--neon-red);
            animation: flashRed 0.3s infinite alternate;
        }

        .siren-blue {
            background: var(--neon-cyan);
            animation: flashBlue 0.3s infinite alternate 0.15s;
        }

        @keyframes flashRed {
            from { opacity: 0.2; box-shadow: 0 0 2px var(--neon-red); }
            to { opacity: 1; box-shadow: 0 0 18px var(--neon-red); }
        }
        @keyframes flashBlue {
            from { opacity: 0.2; box-shadow: 0 0 2px var(--neon-cyan); }
            to { opacity: 1; box-shadow: 0 0 18px var(--neon-cyan); }
        }

        .car-roof {
            position: absolute;
            top: 10px;
            left: 35px;
            width: 70px;
            height: 25px;
            background: #fff;
            border-radius: 12px 12px 0 0;
            border: 2px solid #000;
        }

        .car-body {
            position: absolute;
            top: 32px;
            left: 10px;
            width: 120px;
            height: 26px;
            background: #111;
            border-radius: 6px;
        }

        .headlight {
            position: absolute;
            left: 0;
            top: 6px;
            width: 6px;
            height: 10px;
            background: var(--neon-yellow);
            box-shadow: -10px 0 15px var(--neon-yellow);
        }

        .wheel {
            position: absolute;
            bottom: -8px;
            width: 20px;
            height: 20px;
            background: #222;
            border: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.4s linear infinite;
        }

        .wheel-front { left: 20px; }
        .wheel-rear { right: 20px; }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* --- ゲーム表示 --- */
        .status-box {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid var(--neon-cyan);
        }

        .word-display {
            font-size: 2.2rem;
            color: var(--neon-yellow);
            letter-spacing: 3px;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255,230,0,0.5);
        }

        .typed-char { color: var(--neon-cyan); }
        .roma-hint { color: #888; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ログイン画面 -->
        <div id="login-screen" class="screen active">
            <h1>機捜210 FREEDOM TYPING</h1>
            <p>捜査員名を入力して出動！</p>
            <input type="text" id="username" placeholder="コールサイン (例: 機捜210)"><br>
            <button onclick="login()">出動開始</button>
        </div>

        <!-- メニュー画面 -->
        <div id="menu-screen" class="screen">
            <h1 id="user-display">捜査員待機中</h1>

            <!-- 動くパトカー -->
            <div class="patcar-container">
                <div class="siren-box">
                    <div class="siren-light siren-red"></div>
                    <div class="siren-light siren-blue"></div>
                </div>
                <div class="car-roof"></div>
                <div class="car-body">
                    <div class="headlight"></div>
                    <div class="wheel wheel-front"></div>
                    <div class="wheel wheel-rear"></div>
                </div>
            </div>

            <button onclick="startMode('normal')">通常追跡モード</button>
            <button onclick="startMode('free')">フリー無限走行（時間無制限）</button>
        </div>

        <!-- タイピング画面 -->
        <div id="game-screen" class="screen">
            <div class="status-box">
                <span id="player-info">機捜210</span>
                <span id="score-info">スコア: 0</span>
                <span id="mode-info">通常モード</span>
            </div>

            <!-- バトル中もパトカーが走る -->
            <div class="patcar-container" style="transform: scale(0.85);">
                <div class="siren-box">
                    <div class="siren-light siren-red"></div>
                    <div class="siren-light siren-blue"></div>
                </div>
                <div class="car-roof"></div>
                <div class="car-body">
                    <div class="headlight"></div>
                    <div class="wheel wheel-front"></div>
                    <div class="wheel wheel-rear"></div>
                </div>
            </div>

            <div class="roma-hint" id="roma-hint">keisatsu</div>
            <div class="word-display"><span class="typed-char" id="typed-part"></span><span id="remain-part">keisatsu</span></div>
            <p style="color: #666; font-size: 0.85rem;">ローマ字でタイピング入力！</p>
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen" class="screen">
            <h1>任務完了！</h1>
            <p id="result-detail" style="margin: 20px 0; font-size: 1.2rem;"></p>
            <button onclick="toMenu()">メニューへ戻る</button>
        </div>
    </div>

    <script>
        let player = { name: "機捜210", score: 0, level: 1 };
        let isFreeMode = false;
        let score = 0;
        let wordIndex = 0;
        let typedIdx = 0;

        const wordList = [
            { jp: "けいさつ", roma: "keisatsu" },
            { jp: "ぱとかー", roma: "patoka-" },
            { jp: "さいれん", roma: "sairen" },
            { jp: "きんきゅう", roma: "kinkyuu" },
            { jp: "めんきょ", roma: "menkyo" },
            { jp: "ついせき", roma: "tsuiseki" }
        ];
        let currentWord = {};

        function login() {
            const input = document.getElementById("username").value.trim();
            if (input) player.name = input;
            
            const saved = localStorage.getItem("kisou210_data");
            if (saved) {
                const data = JSON.parse(saved);
                if (data.name === player.name) player = data;
            }
            saveData();
            document.getElementById("user-display").innerText = `捜査員: ${player.name} (Lv.${player.level})`;
            showScreen("menu-screen");
        }

        function saveData() {
            localStorage.setItem("kisou210_data", JSON.stringify(player));
        }

        function showScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        function toMenu() {
            document.getElementById("user-display").innerText = `捜査員: ${player.name} (Lv.${player.level})`;
            showScreen("menu-screen");
        }

        function startMode(mode) {
            isFreeMode = (mode === 'free');
            score = 0;
            wordIndex = 0;
            document.getElementById("mode-info").innerText = isFreeMode ? "フリー無限" : "通常モード";
            showScreen("game-screen");
            nextWord();
            window.addEventListener("keydown", onKeyPress);
        }

        function nextWord() {
            if (!isFreeMode && wordIndex >= 5) {
                window.removeEventListener("keydown", onKeyPress);
                player.score += score;
                player.level++;
                saveData();
                document.getElementById("result-detail").innerText = `獲得スコア: ${score} pt\nレベルアップ！ Lv.${player.level}`;
                showScreen("result-screen");
                return;
            }

            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            typedIdx = 0;
            renderWord();
        }

        function renderWord() {
            document.getElementById("roma-hint").innerText = currentWord.roma;
            document.getElementById("typed-part").innerText = currentWord.roma.substring(0, typedIdx);
            document.getElementById("remain-part").innerText = currentWord.roma.substring(typedIdx);
            document.getElementById("score-info").innerText = `スコア: ${score}`;
            document.getElementById("player-info").innerText = `${player.name} | Lv.${player.level}`;
        }

        function onKeyPress(e) {
            if (!document.getElementById("game-screen").classList.contains("active")) return;
            const target = currentWord.roma[typedIdx];
            if (e.key.toLowerCase() === target) {
                typedIdx++;
                score += 10;
                renderWord();

                if (typedIdx >= currentWord.roma.length) {
                    wordIndex++;
                    setTimeout(nextWord, 200);
                }
            }
        }
    </script>
</body>
</html>
