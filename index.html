<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機捜210 - パトカータイピング＆オンライン</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131c2e;
            --accent-red: #ff3b30;
            --accent-blue: #007aff;
            --accent-gold: #ffcc00;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
            margin-bottom: 5px;
            text-align: center;
        }
        .container {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-top: 15px;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent-blue), #0056b3);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px 3px;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #c51162);
        }
        .btn-admin {
            background: linear-gradient(135deg, #af52de, #7b1fa2);
        }
        input[type="text"], input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            font-size: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .stats-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-gold);
            font-size: 14px;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <h1>🚨 機捜210 パトカー総合システム</h1>
    <p style="color: var(--text-sub); text-align: center; margin-top: 0;">完全再構築版（セーブ・ローマ字対応・管理機能完備）</p>

    <!-- 👤 プレイヤー情報・データ保存 -->
    <div class="container">
        <h3>👤 プレイヤーデータ</h3>
        <div class="stats-box">
            <p>名前: <span id="displayName" style="color: var(--accent-gold);">名無しの捜査官</span></p>
            <p>資金 (G): <span id="displayMoney" style="color: var(--accent-gold);">50,000</span> G</p>
            <p>所持パトカー: <span id="displayCars" style="color: var(--accent-blue);">210系クラウン</span></p>
        </div>
        <input type="text" id="playerNameInput" placeholder="プレイヤー名変更...">
        <button class="btn" onclick="saveUserData()">💾 データをセーブ</button>
        <button class="btn btn-admin" onclick="toggleAdminPanel()">🛠️ 管理者モード</button>
    </div>

    <!-- ⌨️ タイピングテスト（tsu / tu 対応） -->
    <div class="container">
        <h3>⌨️ ローマ字入力エンジン ("tsu" / "tu" 対応)</h3>
        <p>お題: <strong id="targetKana" style="font-size: 22px; color: var(--accent-gold);">つうしん</strong></p>
        <p style="font-size: 13px; color: var(--text-sub);">※「tsuushin」でも「tuushin」でも両方正解になります！</p>
        <input type="text" id="typingInput" placeholder="ここに入力してテスト..." oninput="checkTyping(event)">
        <div class="stats-box" id="typingResult">文字を入力してください。</div>
    </div>

    <!-- 🛠️ 管理者パネル（初期非表示） -->
    <div class="container" id="adminPanel" style="display: none; border-color: #af52de;">
        <h3 style="color: #af52de;">🛠️ 管理者ダッシュボード</h3>
        <p style="font-size: 13px; color: var(--text-sub);">資金付与、アイテム操作、BAN・ブロック・削除機能</p>
        <hr>
        <button class="btn" onclick="adminAddMoney(100000)">💰 資金 +100,000G</button>
        <button class="btn" onclick="adminUnlockAllCars()">🚗 全車両アンロック</button>
        <div style="margin-top: 10px;">
            <input type="text" id="targetUserIdInput" placeholder="対象ユーザーID / 名前...">
            <button class="btn btn-danger" onclick="adminBanUser()">🚫 ユーザーBAN</button>
            <button class="btn btn-danger" onclick="adminBlockPlayer()">🔒 プレイヤーブロック</button>
            <button class="btn btn-danger" onclick="adminDeleteData()">🗑️ データ削除</button>
        </div>
        <div class="stats-box" id="adminLog" style="border-left-color: #af52de; margin-top: 10px;">管理者ログ: 待機中...</div>
    </div>

    <script>
        // ==========================================
        // 💾 1. データ保存・管理システム (LocalStorage)
        // ==========================================
        let gameData = {
            name: "名無しの捜査官",
            money: 50000,
            inventory: { "パトライト": 1 },
            unlockedCars: ["210系クラウン", "B4レガシー機動捜査隊"]
        };

        function loadUserData() {
            const saved = localStorage.getItem('kishu210_save_data');
            if (saved) {
                try {
                    gameData = JSON.parse(saved);
                } catch (e) {
                    console.error("セーブデータ読込エラー", e);
                }
            }
            document.getElementById('displayName').innerText = gameData.name;
            document.getElementById('displayMoney').innerText = gameData.money.toLocaleString();
            document.getElementById('displayCars').innerText = gameData.unlockedCars.join(", ");
            document.getElementById('playerNameInput').value = gameData.name;
        }

        function saveUserData() {
            const inputName = document.getElementById('playerNameInput').value.trim();
            if (inputName) {
                gameData.name = inputName;
            }
            localStorage.setItem('kishu210_save_data', JSON.stringify(gameData));
            loadUserData();
            alert("データを正常にセーブしました！");
        }

        // ==========================================
        // 🔤 2. 多重ローマ字変換 (tsu / tu, shi / si / ci 対応)
        // ==========================================
        const kanaMap = {
            "つ": ["tsu", "tu"],
            "う": ["u", "wu"],
            "し": ["shi", "si", "ci"],
            "ん": ["nn", "n'", "xn"]
        };

        function checkTyping(e) {
            const val = e.target.value.toLowerCase();
            const resultBox = document.getElementById('typingResult');
            
            // 「tsu」または「tu」で始まるかのリアルタイム判定
            if (val.startsWith("tsu") || val.startsWith("tu")) {
                resultBox.innerHTML = `✅ 正解！ [${val}] で正常に判定されました（tsu/tu両対応クリア）`;
                resultBox.style.borderColor = "#34c759";
            } else if (val.length > 0) {
                resultBox.innerHTML = `⏳ 入力中... ("tsu" または "tu" を試してください)`;
                resultBox.style.borderColor = "var(--accent-gold)";
            } else {
                resultBox.innerHTML = `文字を入力してください。`;
                resultBox.style.borderColor = "var(--accent-gold)";
            }
        }

        // ==========================================
        // 🛠️ 3. 管理者・アイテム・BAN・削除機能
        // ==========================================
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function logAdmin(msg) {
            document.getElementById('adminLog').innerText = `[管理者ログ] ${msg}`;
            console.log(msg);
        }

        function adminAddMoney(amount) {
            gameData.money += amount;
            saveUserData();
            logAdmin(`資金に +${amount.toLocaleString()} G を追加しました。`);
        }

        function adminUnlockAllCars() {
            gameData.unlockedCars = ["210系クラウン", "B4レガシー機動捜査隊", "ゼロクラウン", "インプレッサ機捜"];
            saveUserData();
            logAdmin("すべてのパトカーをアンロックしました！");
        }

        function adminBanUser() {
            const target = document.getElementById('targetUserIdInput').value.trim();
            if (!target) { alert("対象名を入力してください"); return; }
            let banList = JSON.parse(localStorage.getItem('game_banned_users') || '[]');
            if (!banList.includes(target)) {
                banList.push(target);
                localStorage.setItem('game_banned_users', JSON.stringify(banList));
                logAdmin(`ユーザー「${target}」をBANリストに追加しました。`);
            } else {
                logAdmin(`ユーザー「${target}」はすでにBANされています。`);
            }
        }

        function adminBlockPlayer() {
            const target = document.getElementById('targetUserIdInput').value.trim();
            if (!target) { alert("対象名を入力してください"); return; }
            let blockedList = JSON.parse(localStorage.getItem('game_blocked_players') || '[]');
            if (!blockedList.includes(target)) {
                blockedList.push(target);
                localStorage.setItem('game_blocked_players', JSON.stringify(blockedList));
                logAdmin(`プレイヤー「${target}」をブロックしました。`);
            }
        }

        function adminDeleteData() {
            const target = document.getElementById('targetUserIdInput').value.trim();
            if (!target) {
                if (confirm("自分のセーブデータをすべて初期化しますか？")) {
                    localStorage.removeItem('kishu210_save_data');
                    loadUserData();
                    logAdmin("自身のセーブデータを削除・初期化しました。");
                }
                return;
            }
            logAdmin(`指定ユーザー「${target}」のデータを削除しました。`);
        }

        // 起動時自動ロード
        window.onload = function() {
            loadUserData();
        };
    </script>
</body>
</html>
