<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>駅システム</title>
<style>
body{
  text-align:center;
  font-family:sans-serif;
  background:#f2f2f2;
}

select, button{
  margin:10px;
  padding:8px 15px;
  border-radius:15px;
  border:none;
}

.big{
  font-size:40px;
  margin:30px;
}
</style>
</head>
<body>

<h1>駅システム</h1>

<!-- 会社選択 -->
<select id="company" onchange="updateStations()">
  <option value="">会社選択</option>
  <option value="jr">JR東日本</option>
  <option value="keikyu">京急</option>
</select>

<!-- 駅選択 -->
<select id="station">
  <option value="">駅選択</option>
</select>

<div class="big" id="display">未選択</div>

<button onclick="selectTrack(1)">1番線</button>
<button onclick="selectTrack(2)">2番線</button>
<button onclick="selectTrack(3)">3番線</button>

<script>
const stationSelect = document.getElementById("station");
const display = document.getElementById("display");

function updateStations(){
  const company = document.getElementById("company").value;
  stationSelect.innerHTML = "<option value=''>駅選択</option>";

  if(company === "jr"){
    stationSelect.innerHTML += "<option value='君津'>君津駅</option>";
    stationSelect.innerHTML += "<option value='木更津'>木更津駅</option>";
  }

  if(company === "keikyu"){
    stationSelect.innerHTML += "<option value='品川'>品川駅</option>";
  }
}

function selectTrack(track){
  const company = document.getElementById("company").value;
  const station = stationSelect.value;

  if(company === "" || station === ""){
    alert("会社と駅を選択してください");
    return;
  }

  display.textContent = company + " " + station + " " + track + "番線";
}
</script>

</body>
</html>
