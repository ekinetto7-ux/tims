<script>
const melody = document.getElementById("melody");
const display = document.getElementById("display");
let loopCheck = null;
let currentTrack = 0;

function playSection(start,end){
  clearInterval(loopCheck);
  melody.currentTime = start;
  melody.play();

  loopCheck = setInterval(function(){
    if(melody.currentTime >= end){
      melody.currentTime = start;
      melody.play();
    }
  },100);
}

function playTrack(track){
  currentTrack = track;
  display.textContent = track + "番線";

  const buttons = document.querySelectorAll(".track-btn");
  buttons.forEach(btn => btn.classList.remove("active"));
  buttons[track-1].classList.add("active");

  if(track === 1){
    playSection(0,28);   // ← 1番線メロディー
  }
  if(track === 2){
    playSection(46,71);
  }
  if(track === 3){
    playSection(175,216);
  }
}

function stopAndDoor(){
  melody.pause();
  clearInterval(loopCheck);

  let start = 0;
  let end = 0;

  if(currentTrack === 1){
    start = 29; end = 39;   // ← 1番線ドア
  }
  if(currentTrack === 2){
    start = 155; end = 167;
  }
  if(currentTrack === 3){
    start = 225; end = 235;
  }

  melody.currentTime = start;
  melody.play();

  const doorEndCheck = setInterval(function(){
    if(melody.currentTime >= end){
      melody.pause();
      clearInterval(doorEndCheck);
    }
  },100);
}
</script>
