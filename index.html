<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機捜210 - タイピングコロシアム</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(16, 22, 36, 0.85);
            --neon-blue: #00f3ff;
            --neon-red: #ff0055;
            --neon-yellow: #f3e600;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0,243,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,243,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 12px;
            background: #05070a;
            border: 2px solid var(--neon-blue);
            color: var(--text-color);
            font-size: 1.2rem;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            outline: none;
        }

        button {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
            transition: 0.2s;
            text-shadow: 0 0 5px var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        button:hover {
            background: var(--neon-blue);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* --- 動くパトカーアニメーション（ファイル不要・CSS描画） --- */
        .pixel-patcar {
            position: relative;
            width: 120px;
            height: 60px;
            margin: 20px auto;
            animation: drive 1.5s infinite ease-in-out;
        }

        @keyframes drive {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(-1deg); }
        }

        .siren {
            position: absolute;
            top: 0;
            width: 14px;
            height: 8px;
            border-radius: 3px 3px 0 0;
        }
        .siren.red {
            left: 45px;
            background: var(--neon-red);
            animation: blinkRed 0.4s infinite alternate;
        }
        .siren.blue {
            left: 61px;
            background: var(--neon-blue);
            animation: blinkBlue 0.4s infinite alternate 0.2s;
        }

        @keyframes blinkRed {
            from { opacity: 0.3; box-shadow: 0 0 2px var(--neon-red); }
            to { opacity: 1; box-shadow: 0 0 15px var(--neon-red), 0 0 25px var(--neon-red); }
        }
        @keyframes blinkBlue {
            from { opacity: 0.3; box-shadow: 0 0 2px var(--neon-blue); }
            to { opacity: 1; box-shadow: 0 0 15px var(--neon-blue), 0 0 25px var(--neon-blue); }
        }

        .car-top {
            position: absolute;
            top: 8px;
            left: 30px;
            width: 60px;
            height: 22px;
            background: #ffffff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border: 2px solid #111;
        }
        .car-bottom {
            position: absolute;
            top: 28px;
            left: 10px;
            width: 100px;
            height: 22px;
            background: #111111;
            border-radius: 5px;
        }
        .light-front {
            position: absolute;
            left: 0;
            top: 4px;
            width: 6px;
            height: 8px;
            background: var(--neon-yellow);
            box-shadow: -8px 0 12px var(--neon-yellow);
        }
        .wheel {
            position: absolute;
            bottom: -6px;
            width: 16px;
            height: 16px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .wheel-left { left: 15px; }
        .wheel-right { right: 15px; }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* --- バトル画面スタイル --- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(0,243,255,0.3);
        }

        .target-word {
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin: 20px 0;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(243,230,0,0.5);
        }

        .typed {
            color: var(--neon-blue);
        }

        .roma-guide {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 20px;
        }

        .enemy-info {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--neon-red);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ログイン画面 -->
        <div id="auth-screen" class="screen active">
            <h1>機捜210 タイピング</h1>
            <p>プレイヤー名を入力して出動せよ！</p>
            <input type="text" id="username" placeholder="プレイヤー名 (例: 捜査員210)"><br>
            <button onclick="loginUser()">ログイン / 登録</button>
        </div>

        <!-- 2. メニュー画面 -->
        <div id="menu-screen" class="screen">
            <h1>出動準備完了</h1>
            <p id="welcome-msg" style="margin-bottom: 15px; font-size: 1.2rem;"></p>

            <!-- 動くパトカー（CSSアニメーション） -->
            <div class="pixel-patcar">
                <div class="siren red"></div>
                <div class="siren blue"></div>
                <div class="car-body">
                    <div class="car-top"></div>
                    <div class="car-bottom">
                        <div class="light-front"></div>
                        <div class="wheel wheel-left"></div>
                        <div class="wheel wheel-right"></div>
                    </div>
                </div>
            </div>

            <button onclick="startBattle()">パトロール出動（ゲーム開始）</button>
        </div>

        <!-- 3. バトル画面 -->
        <div id="battle-screen" class="screen">
            <div class="status-bar">
                <span id="player-status">名無し | Lv.1</span>
                <span id="score-status">スコア: 0</span>
            </div>

            <div class="enemy-info" id="enemy-name">犯行車両を追尾中...</div>

            <!-- パトカーアニメーション常時表示 -->
            <div class="pixel-patcar" style="transform: scale(0.8);">
                <div class="siren red"></div>
                <div class="siren blue"></div>
                <div class="car-body">
                    <div class="car-top"></div>
                    <div class="car-bottom">
                        <div class="light-front"></div>
                        <div class="wheel wheel-left"></div>
                        <div class="wheel wheel-right"></div>
                    </div>
                </div>
            </div>

            <div class="roma-guide" id="roma-guide">keisatsu</div>
            <div class="target-word" id="target-word"><span class="typed" id="typed-part"></span><span id="remaining-part">keisatsu</span></div>
            <p style="color: #aaa; font-size: 0.9rem;">キーボードでローマ字を入力せよ！</p>
        </div>

        <!-- 4. リザルト画面 -->
        <div id="result-screen" class="screen">
            <h1>逮捕完了！</h1>
            <p id="result-text" style="font-size: 1.3rem; margin: 20px 0;"></p>
            <button onclick="toMenu()">メニューに戻る</button>
        </div>
    </div>

    <script>
        // ゲームデータ管理
        let userData = {
            name: "",
            score: 0,
            level: 1
        };

        const words = [
            { jp: "けいさつ", roma: "keisatsu" },
            { jp: "ぱとかー", roma: "patoka-" },
            { jp: "さいれん", roma: "sairen" },
            { jp: "きんきゅう", roma: "kinkyuu" },
            { jp: "とせいきゅう", roma: "toseikyuu" },
            { jp: "めんきょていし", roma: "menkyoteishi" },
            { jp: "そくいん", roma: "sokuin" }
        ];

        let currentWord = {};
        let typedIndex = 0;
        let score = 0;
        let wordCount = 0;

        // ログイン処理（ローカルストレージ保存）
        function loginUser() {
            const nameInput = document.getElementById("username").value.trim();
            if (!nameInput) {
                alert("プレイヤー名を入力してください！");
                return;
            }

            userData.name = nameInput;
            
            // ローカルストレージから前回のデータをロード（あれば）
            const saved = localStorage.getItem("kishu210_typing_user");
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.name === nameInput) {
                    userData = parsed;
                }
            }
            saveData();

            document.getElementById("welcome-msg").innerText = `捜査員: ${userData.name} (Lv.${userData.level})`;
            switchScreen("menu-screen");
        }

        function saveData() {
            localStorage.setItem("kishu210_typing_user", JSON.stringify(userData));
        }

        function switchScreen(screenId) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(screenId).classList.add("active");
        }

        function toMenu() {
            document.getElementById("welcome-msg").innerText = `捜査員: ${userData.name} (Lv.${userData.level})`;
            switchScreen("menu-screen");
        }

        // バトル開始
        function startBattle() {
            score = 0;
            wordCount = 0;
            switchScreen("battle-screen");
            nextWord();
            window.addEventListener("keydown", handleKeypress);
        }

        function nextWord() {
            if (wordCount >= 5) {
                // 5問クリアでリザルトへ
                window.removeEventListener("keydown", handleKeypress);
                userData.score += score;
                if (score >= 300) userData.level++;
                saveData();
                document.getElementById("result-text").innerText = `スコア: ${score} pt 獲得！\n合計レベル: ${userData.level}`;
                switchScreen("result-screen");
                return;
            }

            currentWord = words[Math.floor(Math.random() * words.length)];
            typedIndex = 0;
            updateWordDisplay();
            document.getElementById("enemy-name").innerText = `容疑車両 #${wordCount + 1} を追跡中...`;
        }

        function updateWordDisplay() {
            document.getElementById("roma-guide").innerText = currentWord.roma;
            document.getElementById("typed-part").innerText = currentWord.roma.substring(0, typedIndex);
            document.getElementById("remaining-part").innerText = currentWord.roma.substring(typedIndex);
            document.getElementById("score-status").innerText = `スコア: ${score}`;
            document.getElementById("player-status").innerText = `${userData.name} | Lv.${userData.level}`;
        }

        // キー入力判定
        function handleKeypress(e) {
            if (document.getElementById("battle-screen").classList.contains("active")) {
                const expectedChar = currentWord.roma[typedIndex];
                if (e.key.toLowerCase() === expectedChar) {
                    typedIndex++;
                    score += 10;
                    updateWordDisplay();

                    if (typedIndex >= currentWord.roma.length) {
                        wordCount++;
                        setTimeout(nextWord, 300); // 次の問題へ
                    }
                }
            }
        }
    </script>
</body>
</html>
