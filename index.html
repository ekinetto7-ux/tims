<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR車両編成総合データベース</title>
    <style>
        :root {
            --jr-east: #22ac38;
            --jr-central: #ff7e00;
            --jr-west: #0072bc;
            --dark-bg: #1a1a1a;
            --keiyo-color: #c9222b;
            --sobu-color: #003399;
            --mc-color: #4a7227;
        }
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; color: #333; }
        .portal-header { background-color: var(--dark-bg); color: #fff; padding: 40px 20px; text-align: center; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .jr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .jr-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card-header { padding: 15px 20px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .east { background-color: var(--jr-east); }
        .central { background-color: var(--jr-central); }
        .west { background-color: var(--jr-west); }
        .minecraft { background-color: var(--mc-color); }
        .card-body { padding: 20px; flex-grow: 1; }
        .route-link { display: block; background: #f8f9fa; border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 10px; border-radius: 5px; text-decoration: none; color: #333; font-weight: bold; border-left: 5px solid #737373; }
        .link-je { border-left-color: var(--keiyo-color); }
        .link-jo { border-left-color: var(--sobu-color); }
        .link-mc { border-left-color: var(--mc-color); }
    </style>
</head>
<body>
    <div class="portal-header">
        <h1>🚉 JR車両編成 総合データベース</h1>
    </div>
    <div class="container">
        <div class="jr-grid">
            <div class="jr-card">
                <div class="card-header east"><span>JR東日本</span></div>
                <div class="card-body">
                    <a href="keiyo.html" class="route-link link-je">JE 京葉線</a>
                    <a href="sobu.html" class="route-link link-jo">JO 総武・横須賀線</a>
                </div>
            </div>
            <!-- Minecraft 鉄道研究所 -->
            <div class="jr-card">
                <div class="card-header minecraft"><span>Minecraft 鉄道研究所</span></div>
                <div class="card-body">
                    <p>Kainoラボによる鉄道再現の特設サイトです。</p>
                    <a href="https://github.io" class="route-link link-mc" target="_blank">🌐 Minecraft-Kaino-lab へ移動する</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
