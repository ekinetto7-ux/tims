<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機捜210 - SUPER HIGHWAY TYPING</title>
    <style>
        :root {
            --bg-color: #030611;
            --panel-bg: rgba(8, 14, 28, 0.92);
            --neon-cyan: #00f3ff;
            --neon-red: #ff0055;
            --neon-yellow: #ffe600;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            background: #000;
            border: 2px solid var(--neon-cyan);
            color: #fff;
            font-size: 1.2rem;
            border-radius: 6px;
            margin: 15px 0;
            text-align: center;
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        button.red {
            color: var(--neon-red);
            border-color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }
        button.red:hover {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-red);
        }

        /* --- 疾走する道路アニメーション背景 --- */
        .highway-stage {
            position: relative;
            width: 100%;
            height: 180px;
            background: linear-gradient(180deg, #050b18 0%, #111a2e 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.4);
            margin: 15px 0;
        }

        /* 流れる中央線 */
        .road-lines {
            position: absolute;
            top: 50%;
            left: 0;
            width: 200%;
            height: 4px;
            background: repeating-linear-gradient(90deg, var(--neon-yellow) 0px, var(--neon-yellow) 40px, transparent 40px, transparent 80px);
            animation: roadMove 0.4s linear infinite;
        }

        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-80px); }
        }

        /* --- パトカー（自機）アニメーション --- */
        .patcar {
            position: absolute;
            bottom: 35px;
            left: 50px;
            width: 130px;
            height: 55px;
            animation: bounce 0.8s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .siren-light {
            position: absolute;
            top: -6px;
            left: 50px;
            width: 28px;
            height: 8px;
            display: flex;
            justify-content: space-between;
        }
        .siren-r, .siren-b {
            width: 12px;
            height: 100%;
            border-radius: 3px 3px 0 0;
        }
        .siren-r { background: var(--neon-red); animation: flashRed 0.25s infinite alternate; }
        .siren-b { background: var(--neon-cyan); animation: flashBlue 0.25s infinite alternate 0.12s; }

        @keyframes flashRed {
            from { opacity: 0.3; box-shadow: 0 0 2px var(--neon-red); }
            to { opacity: 1; box-shadow: 0 0 20px var(--neon-red); }
        }
        @keyframes flashBlue {
            from { opacity: 0.3; box-shadow: 0 0 2px var(--neon-cyan); }
            to { opacity: 1; box-shadow: 0 0 20px var(--neon-cyan); }
        }

        .car-top {
            position: absolute;
            top: 0;
            left: 30px;
            width: 65px;
            height: 24px;
            background: #ffffff;
            border-radius: 10px 10px 0 0;
            border: 2px solid #000;
        }
        .car-body {
            position: absolute;
            top: 22px;
            left: 5px;
            width: 115px;
            height: 24px;
            background: #111;
            border-radius: 5px;
        }
        .headlight {
            position: absolute;
            right: -4px;
            top: 4px;
            width: 6px;
            height: 8px;
            background: var(--neon-yellow);
            box-shadow: 12px 0 15px var(--neon-yellow);
        }
        .wheel {
            position: absolute;
            bottom: -6px;
            width: 18px;
            height: 18px;
            background: #222;
            border: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.3s linear infinite;
        }
        .wheel.f { right: 18px; }
        .wheel.r { left: 18px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- 敵車両（容疑者）アニメーション --- */
        .enemy-car {
            position: absolute;
            bottom: 35px;
            right: 60px;
            width: 120px;
            height: 50px;
            animation: bounce 0.9s infinite ease-in-out 0.2s;
        }
        .enemy-body {
            position: absolute;
            top: 15px;
            left: 0;
            width: 110px;
            height: 26px;
            background: var(--neon-red);
            border-radius: 6px;
            box-shadow: 0 0 10px var(--neon-red);
        }
        .enemy-top {
            position: absolute;
            top: 0;
            left: 20px;
            width: 55px;
            height: 18px;
            background: #222;
            border-radius: 8px 8px 0 0;
        }

        /* タイピングテキストエリア */
        .word-box {
            margin: 15px 0;
        }
        .target-word {
            font-size: 2.4rem;
            color: var(--neon-yellow);
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(255, 230, 0, 0.6);
        }
        .typed-char { color: var(--neon-cyan); }
        .roma-sub { color: #888; font-size: 1.2rem; margin-bottom: 5px; }

        /* スパーク演出用フラッシュ */
        .spark-flash {
            animation: flashSpark 0.1s ease-out;
        }
        @keyframes flashSpark {
            0% { background: rgba(0, 243, 255, 0.2); }
            100% { background: var(--panel-bg); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- ログイン画面 -->
        <div id="login-screen" class="screen active">
            <h1>機捜210 HIGHWAY CHASE</h1>
            <p>捜査員名を入力して出動！</p>
            <input type="text" id="username" placeholder="コールサイン (例: 機捜210)"><br>
            <button onclick="login()">出動認証</button>
        </div>

        <!-- モード選択画面 -->
        <div id="menu-screen" class="screen">
            <h1 id="user-display">捜査員待機中</h1>

            <!-- 疾走道路＆パトカープレビュー -->
            <div class="highway-stage">
                <div class="road-lines"></div>
                <div class="patcar">
                    <div class="siren-light">
                        <div class="siren-r"></div>
                        <div class="siren-b"></div>
                    </div>
                    <div class="car-top"></div>
                    <div class="car-body">
                        <div class="headlight"></div>
                        <div class="wheel r"></div>
                        <div class="wheel f"></div>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button onclick="startMode('free')">🟢 自由走行（無限疾走）</button>
                <button class="red" onclick="startMode('mission')">🔴 メインミッション（追撃逮捕）</button>
                <button onclick="startMode('practice')">🔵 練習（じっくりトレーニング）</button>
            </div>
        </div>

        <!-- タイピングゲーム画面 -->
        <div id="game-screen" class="screen">
            <div style="display: flex; justify-content: space-between; font-size: 1.1rem; color: var(--neon-cyan);">
                <span id="player-info">機捜210</span>
                <span id="mode-title" style="color: var(--neon-yellow); font-weight: bold;">自由走行</span>
                <span id="score-info">スコア: 0</span>
            </div>

            <!-- 疾走道路＆追撃グラフィック -->
            <div class="highway-stage">
                <div class="road-lines"></div>

                <!-- パトカー -->
                <div class="patcar">
                    <div class="siren-light">
                        <div class="siren-r"></div>
                        <div class="siren-b"></div>
                    </div>
                    <div class="car-top"></div>
                    <div class="car-body">
                        <div class="headlight"></div>
                        <div class="wheel r"></div>
                        <div class="wheel f"></div>
                    </div>
                </div>

                <!-- 敵車両 -->
                <div class="enemy-car">
                    <div class="enemy-top"></div>
                    <div class="enemy-body"></div>
                    <div class="wheel r"></div>
                    <div class="wheel f"></div>
                </div>
            </div>

            <div class="word-box">
                <div class="roma-sub" id="roma-sub">keisatsu</div>
                <div class="target-word">
                    <span class="typed-char" id="typed-part"></span><span id="remain-part">keisatsu</span>
                </div>
            </div>

            <button onclick="toMenu()" style="padding: 6px 15px; font-size: 0.9rem;">一時停止 / メニューへ</button>
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen" class="screen">
            <h1 id="result-title">ミッション完了！</h1>
            <p id="result-detail" style="margin: 20px 0; font-size: 1.3rem; line-height: 1.6;"></p>
            <button onclick="toMenu()">メニューへ戻る</button>
        </div>
    </div>

    <script>
        let player = { name: "機捜210", score: 0, level: 1 };
        let currentMode = "free"; // 'free', 'mission', 'practice'
        let score = 0;
        let wordCount = 0;
        let typedIdx = 0;

        const wordList = [
            { jp: "けいさつ", roma: "keisatsu" },
            { jp: "ぱとかー", roma: "patoka-" },
            { jp: "さいれん", roma: "sairen" },
            { jp: "きんきゅう", roma: "kinkyuu" },
            { jp: "めんきょていし", roma: "menkyoteishi" },
            { jp: "ついせき", roma: "tsuiseki" },
            { jp: "はいうぇい", roma: "haiwei" }
        ];
        let currentWord = {};

        function login() {
            const input = document.getElementById("username").value.trim();
            if (input) player.name = input;

            const saved = localStorage.getItem("kisou210_v2_data");
            if (saved) {
                const data = JSON.parse(saved);
                if (data.name === player.name) player = data;
            }
            saveData();
            document.getElementById("user-display").innerText = `捜査員: ${player.name} (Lv.${player.level})`;
            showScreen("menu-screen");
        }

        function saveData() {
            localStorage.setItem("kisou210_v2_data", JSON.stringify(player));
        }

        function showScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        function toMenu() {
            window.removeEventListener("keydown", onKeyPress);
            document.getElementById("user-display").innerText = `捜査員: ${player.name} (Lv.${player.level})`;
            showScreen("menu-screen");
        }

        function startMode(mode) {
            currentMode = mode;
            score = 0;
            wordCount = 0;

            const titleMap = {
                free: "🟢 自由走行",
                mission: "🔴 メインミッション",
                practice: "🔵 練習モード"
            };
            document.getElementById("mode-title").innerText = titleMap[mode];
            showScreen("game-screen");
            nextWord();
            window.addEventListener("keydown", onKeyPress);
        }

        function nextWord() {
            if (currentMode === "mission" && wordCount >= 5) {
                window.removeEventListener("keydown", onKeyPress);
                player.score += score;
                player.level++;
                saveData();
                document.getElementById("result-title").innerText = "容疑車両の確保完了！";
                document.getElementById("result-detail").innerText = `獲得スコア: ${score} pt\nレベルアップ！ Lv.${player.level}`;
                showScreen("result-screen");
                return;
            }

            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            typedIdx = 0;
            renderWord();
        }

        function renderWord() {
            document.getElementById("roma-sub").innerText = currentWord.roma;
            document.getElementById("typed-part").innerText = currentWord.roma.substring(0, typedIdx);
            document.getElementById("remain-part").innerText = currentWord.roma.substring(typedIdx);
            document.getElementById("score-info").innerText = `スコア: ${score}`;
            document.getElementById("player-info").innerText = `${player.name} | Lv.${player.level}`;
        }

        function onKeyPress(e) {
            if (!document.getElementById("game-screen").classList.contains("active")) return;
            const target = currentWord.roma[typedIdx];
            if (e.key.toLowerCase() === target) {
                typedIdx++;
                score += 10;

                // 入力時のスパークフラッシュ
                const container = document.getElementById("main-container");
                container.classList.remove("spark-flash");
                void container.offsetWidth; // リモートトリガー
                container.classList.add("spark-flash");

                renderWord();

                if (typedIdx >= currentWord.roma.length) {
                    wordCount++;
                    setTimeout(nextWord, 150);
                }
            }
        }
    </script>
</body>
</html>
