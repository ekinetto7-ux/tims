 <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR車両編成総合データベース</title>
    <style>
        /* JR各社のコーポレートカラー設定 */
        :root {
            --jr-east: #22ac38;   /* JR東日本：グリーン */
            --jr-central: #ff7e00;/* JR東海：オレンジ */
            --jr-west: #0072bc;   /* JR西日本：ブルー */
            --dark-bg: #1a1a1a;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* 鉄道ネットワークを意識したクールなポータルヘッダー */
        .portal-header {
            background-color: var(--dark-bg);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid #737373;
        }
        .portal-header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .portal-header p {
            margin: 10px 0 0 0;
            font-size: 14px;
            color: #aaa;
            letter-spacing: 4px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }

        /* 会社別メニューカードの配置（グリッドレイアウト） */
        .jr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 会社別デザインの共通ベース */
        .jr-card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .jr-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* 各社ごとのヘッダーカラー */
        .card-header {
            padding: 15px 20px;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header .logo-text {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
        }
        
        .east { background-color: var(--jr-east); }
        .central { background-color: var(--jr-central); }
        .west { background-color: var(--jr-west); }

        .card-body {
            padding: 20px;
            flex-grow: 1;
        }
        .card-body p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #666;
        }

        /* 各路線へのリンクボタン */
        .route-link {
            display: block;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            border-left: 5px solid #737373;
        }
        .route-link:last-child { margin-bottom: 0; }
        
        /* 路線ごとの左ラインカラー */
        .link-je { border-left-color: #c9222b; } /* 京葉線（ワインレッド） */
        .link-jm { border-left-color: #f15a22; } /* 武蔵野線（オレンジ） */
        .link-ca { border-left-color: #ff7e00; } /* 東海道線東海（オレンジ） */
        .link-a  { border-left-color: #0072bc; } /* 北陸線（ブルー） */

        .route-link:hover {
            background: #f1f3f5;
            padding-left: 18px;
        }
    </style>
</head>
<body>

    <!-- 総合トップヘッダー -->
    <div class="portal-header">
        <h1>🚉 JR車両編成 総合データベース</h1>
        <p>JAPAN RAILWAYS ROSTER PORTAL</p>
    </div>

    <div class="container">
        <div class="section-title">🏢 鉄道会社を選択</div>
        
        <div class="jr-grid">
            
            <!-- JR東日本グループ -->
            <div class="jr-card">
                <div class="card-header east">
                    <span>JR東日本</span>
                    <span class="logo-text">JR</span>
                </div>
                <div class="card-body">
                    <p>首都圏エリアや新幹線、東北・信越地方の車両データベースです。</p>
                    <!-- 作成した京葉線データベースのファイル名(例: keiyo.html)に合わせてリンク先を変更できます -->
                    <a href="index.html" class="route-link link-je">JE 京葉線 (E233系5000番台)</a>
                    <a href="musashino.html" class="route-link link-jm">JM 武蔵野線 (E231系/209系)</a>
                </div>
            </div>

            <!-- JR東海グループ -->
            <div class="jr-card">
                <div class="card-header central">
                    <span>JR東海</span>
                    <span class="logo-text">JR</span>
                </div>
                <div class="card-body">
                    <p>東海道新幹線や名古屋エリア、静岡エリアを走る車両のデータベースです。</p>
                    <a href="#central-tokaido" class="route-link link-ca">CA 東海道本線 (313系/315系)</a>
                </div>
            </div>

            <!-- JR西日本グループ -->
            <div class="jr-card">
                <div class="card-header west">
                    <span>JR西日本</span>
                    <span class="logo-text">JR</span>
                </div>
                <div class="card-body">
                    <p>アーバンネットワーク（関西圏）や山陽・北陸エリアの車両データベースです。</p>
                    <a href="#west-hokuriku" class="route-link link-a">A 北陸本線 (521系)</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
