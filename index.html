<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピクミン タイピング大作戦 - Carry Animation Edition</title>
    <style>
        :root {
            --bg-dark: #040907;
            --panel-bg: rgba(10, 26, 20, 0.96);
            --accent-green: #2ed573;
            --accent-gold: #ffb142;
            --accent-red: #ff5252;
            --accent-blue: #1e90ff;
            --text-main: #f1f2f6;
            --text-sub: #a4b0be;
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #113524 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--accent-gold);
            text-shadow: 0 0 25px rgba(255, 177, 66, 0.8);
            font-size: 26px;
            margin: 5px 0;
            text-align: center;
            letter-spacing: 2px;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 12px;
            text-align: center;
        }
        .container {
            background: var(--panel-bg);
            border: 2px solid rgba(46, 213, 115, 0.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent-green), #1b8a43);
            color: #fff;
            border: none;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
            margin: 5px 0;
            width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(46, 213, 115, 0.6); }
        .btn-ai { background: linear-gradient(135deg, var(--accent-red), #b71540); box-shadow: 0 5px 15px rgba(255, 82, 82, 0.4); }
        .btn-sub { background: linear-gradient(135deg, #3742fa, #2f3542); width: auto; padding: 7px 14px; font-size: 12px; }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 13px;
            font-size: 17px;
            background: rgba(3, 10, 8, 0.95);
            border: 2px solid #2f3640;
            color: #fff;
            border-radius: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            outline: none;
            transition: 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(255, 177, 66, 0.5);
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .stat-card {
            background: rgba(3, 10, 8, 0.85);
            padding: 10px 14px;
            border-radius: 12px;
            border-left: 5px solid var(--accent-gold);
        }
        .stat-label { font-size: 11px; color: var(--text-sub); }
        .stat-val { font-size: 18px; font-weight: bold; color: #fff; margin-top: 3px; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 177, 66, 0.6);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 10px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 12px;
            background: #061811;
        }
        canvas {
            display: block;
            width: 100%;
            height: 300px;
        }
        .word-overlay {
            background: rgba(3, 10, 8, 0.96);
            border-radius: 14px;
            padding: 15px;
            border: 2px solid rgba(255, 177, 66, 0.5);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .target-kanji { font-size: 36px; font-weight: 900; color: var(--accent-gold); margin: 2px 0; letter-spacing: 2px; text-shadow: 0 0 12px rgba(255,177,66,0.5); }
        .target-kana { font-size: 16px; color: var(--accent-green); letter-spacing: 2px; margin-bottom: 8px; }
        .roman-guide {
            font-size: 26px;
            font-family: monospace;
            margin: 5px 0;
            background: rgba(0,0,0,0.8);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 10px;
            letter-spacing: 4px;
            border: 1px solid rgba(46,213,115,0.4);
        }
        .typed-char { color: #2ed573; text-shadow: 0 0 10px rgba(46,213,115,0.8); font-weight: bold; }
        .untyped-char { color: #a4b0be; }

        .hp-bar-container {
            width: 100%;
            background: #040907;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            margin: 5px 0 10px;
            border: 1px solid #2f3640;
        }
        .hp-bar { height: 100%; transition: width 0.25s ease; }
        .hp-player { background: linear-gradient(90deg, #2ed573, #7bed9f); }
        .hp-ai { background: linear-gradient(90deg, var(--accent-red), #ff6b6b); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🌿 ピクミン タイピング大作戦</h1>
    <div class="subtitle">Carry Animation Edition — 生物運搬アニメーション搭載</div>

    <!-- 1. ログイン画面 -->
    <div class="container" id="authScreen">
        <h3>🔐 探検隊 隊員認証</h3>
        <p style="font-size: 13px; color: var(--text-sub);">名前とパスワードを入力して、探索データをロードしよう。</p>
        <input type="text" id="authName" placeholder="隊長名（例: オリマー）">
        <input type="password" id="authPass" placeholder="パスワード">
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button class="btn" onclick="handleRegister()">🌱 新規隊員登録</button>
            <button class="btn" style="background: linear-gradient(135deg, var(--accent-blue), #1e3799);" onclick="handleLogin()">🔑 ログイン</button>
        </div>
        <div id="authMsg" style="margin-top: 10px; font-size: 13px; color: var(--accent-gold); text-align: center;"></div>
    </div>

    <!-- 2. ホーム画面 -->
    <div class="container hidden" id="homeScreen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">🚀 ドルフィン号 司令室</h3>
            <button class="btn btn-sub" onclick="logout()">ログアウト</button>
        </div>
        <div class="status-grid">
            <div class="stat-card">
                <div class="stat-label">隊長名</div>
                <div class="stat-val" id="homeName">-</div>
            </div>
            <div class="stat-card" style="border-color: var(--accent-green);">
                <div class="stat-label">ピクミン隊列数</div>
                <div class="stat-val" id="homePikmin">0 匹</div>
            </div>
            <div class="stat-card" style="border-color: var(--accent-gold);">
                <div class="stat-label">探索スコア</div>
                <div class="stat-val" id="homeScore">0 pt</div>
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 16px 0;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" onclick="startPlay('solo')">🌱 惑星探索（一人プレイ討伐）</button>
            <button class="btn btn-ai" onclick="startPlay('ai')">🔥 ライバル対決（vs ルーイAI）</button>
        </div>
    </div>

    <!-- 3. ゲームプレイ画面 -->
    <div class="container hidden" id="gameScreen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="gameModeTitle" style="font-weight: bold; color: var(--accent-gold); font-size: 15px;">🌱 探索モード</span>
            <button class="btn btn-sub" onclick="backToHome()">← 司令室へ戻る</button>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span>あなたの討伐ポイント</span>
                <span id="p1ScoreText">0 / 1000</span>
            </div>
            <div class="hp-bar-container"><div class="hp-bar hp-player" id="p1Bar" style="width: 0%;"></div></div>

            <div id="aiGaugeWrapper" class="hidden">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--accent-red);">
                    <span>🤖 ルーイAI</span>
                    <span id="aiScoreText">0 / 1000</span>
                </div>
                <div class="hp-bar-container"><div class="hp-bar hp-ai" id="aiBar" style="width: 0%;"></div></div>
            </div>
        </div>

        <!-- 3D立体映像＆運搬アニメーション Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="760" height="290"></canvas>
        </div>

        <div class="word-overlay">
            <div class="target-kanji" id="wordKanji">チャッピー</div>
            <div class="target-kana" id="wordKana">ちゃっぴー</div>
            <div class="roman-guide" id="romanGuide"><span class="untyped-char">chappi</span></div>
            <div id="feedbackMsg" style="font-size: 14px; font-weight: bold; color: var(--accent-green); min-height: 20px; margin-top: 5px;">キーボードを直接叩いてピクミンを突撃させろ！</div>
        </div>
    </div>

    <audio id="hitSound" src="d.mp3" preload="auto"></audio>

    <script>
        let currentUser = null;
        function getAllUsers() { try { return JSON.parse(localStorage.getItem('pikmin_carry_users') || '{}'); } catch(e){ return {}; } }
        function saveAllUsers(u) { localStorage.setItem('pikmin_carry_users', JSON.stringify(u)); }

        function handleRegister() {
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const msg = document.getElementById('authMsg');
            if (!name || !pass) { msg.innerText = "⚠️ 隊長名とパスワードを入力してください"; return; }
            let users = getAllUsers();
            if (users[name]) { msg.innerText = "⚠️ すでに登録されている隊長名です"; return; }
            users[name] = { password: pass, pikmin: 20, score: 0 };
            saveAllUsers(users);
            currentUser = { name, data: users[name] };
            goToHome();
        }

        function handleLogin() {
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const msg = document.getElementById('authMsg');
            let users = getAllUsers();
            if (!users[name] || users[name].password !== pass) { msg.innerText = "❌ 認証失敗：名前かパスワードが違います"; return; }
            currentUser = { name, data: users[name] };
            goToHome();
        }

        function logout() { currentUser = null; document.getElementById('homeScreen').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); }
        function goToHome() { document.getElementById('authScreen').classList.add('hidden'); document.getElementById('homeScreen').classList.remove('hidden'); updateHomeUI(); }
        function updateHomeUI() {
            if (!currentUser) return;
            document.getElementById('homeName').innerText = currentUser.name;
            document.getElementById('homePikmin', '').innerText = `${currentUser.data.pikmin.toLocaleString()} 匹`;
            document.getElementById('homeScore').innerText = `${currentUser.data.score.toLocaleString()} pt`;
            let users = getAllUsers(); users[currentUser.name] = currentUser.data; saveAllUsers(users);
        }

        // ==========================================
        // 🌟 3D立体映像 ＆ 運搬アニメーションエンジン
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let animFrameId = null;

        let squad = [];
        let attackers = [];
        let carriers = []; // 運搬中のピクミンたち
        let popups = [];
        
        let gameState = 'battle'; // 'battle' または 'carry'
        let enemy = {
            x: 600,
            y: 155,
            scale: 1.2,
            hp: 100,
            maxHp: 100,
            shake: 0,
            name: "チャッピー",
            color: "#d63031",
            alpha: 1.0
        };

        function initSquad() {
            squad = [];
            const colors = ["#ff4757", "#ffa502", "#1e90ff"];
            const count = Math.min(32, Math.max(12, currentUser ? currentUser.data.pikmin : 15));
            for (let i = 0; i < count; i++) {
                squad.push({
                    x: 80 + (i % 6) * 26 + Math.random() * 8,
                    y: 95 + Math.floor(i / 6) * 30 + Math.random() * 8,
                    color: colors[i % 3],
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function spawnAttack(isCritical) {
            if (gameState !== 'battle') return;
            const colors = ["#ff4757", "#ffa502", "#1e90ff"];
            const num = isCritical ? 10 : 3;
            for (let i = 0; i < num; i++) {
                attackers.push({
                    x: 160 + Math.random() * 50,
                    y: 110 + Math.random() * 90,
                    targetX: enemy.x - 40 + Math.random() * 60,
                    targetY: enemy.y - 20 + Math.random() * 40,
                    progress: 0,
                    speed: 0.07 + Math.random() * 0.04,
                    color: colors[Math.floor(Math.random() * 3)],
                    crit: isCritical
                });
            }
        }

        // 撃破後の生物運搬アニメーション開始
        function startCarryingSequence() {
            gameState = 'carry';
            carriers = [];
            const colors = ["#ff4757", "#ffa502", "#1e90ff"];
            // 6匹のピクミンが原生生物を取り囲んで運ぶ
            for (let i = 0; i < 6; i++) {
                carriers.push({
                    offsetX: -35 + (i * 12),
                    offsetY: 15 + (i % 2) * 8,
                    color: colors[i % 3]
                });
            }
        }

        function draw3DPikmin(x, y, color, scale, bounce) {
            ctx.save();
            ctx.translate(x, y - Math.abs(Math.sin(bounce)) * 7 * scale);
            ctx.scale(scale, scale);

            ctx.fillStyle = "rgba(0,0,0,0.35)";
            ctx.beginPath(); ctx.ellipse(0, 10, 6, 3, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = color;
            ctx.beginPath(); ctx.ellipse(0, 4, 6, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -7, 6.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(2.2, -8, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(2.9, -8, 1, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = "#2ed573"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -13); ctx.quadraticCurveTo(3, -20, 8, -19); ctx.stroke();
            ctx.fillStyle = "#2ed573";
            ctx.beginPath(); ctx.ellipse(10, -19, 4.5, 2.2, 0.4, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function draw3DEnemy(time) {
            if (enemy.alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = enemy.alpha;
            const sx = enemy.shake > 0 ? (Math.random() - 0.5) * enemy.shake : 0;
            const sy = enemy.shake > 0 ? (Math.random() - 0.5) * enemy.shake : 0;
            if (enemy.shake > 0) enemy.shake *= 0.82;

            const breathe = gameState === 'battle' ? Math.sin(time * 0.0035) * 4 : 0;
            ctx.translate(enemy.x + sx, enemy.y + sy + breathe);
            ctx.scale(enemy.scale, enemy.scale);

            ctx.fillStyle = "rgba(0,0,0,0.55)";
            ctx.beginPath(); ctx.ellipse(10, 58, 62, 18, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = enemy.color;
            ctx.beginPath(); ctx.ellipse(15, 8, 54, 44, 0, 0, Math.PI * 2); ctx.fill();

            const grad = ctx.createRadialGradient(-5, -10, 5, 0, 0, 45);
            grad.addColorStop(0, "rgba(255,255,255,0.35)");
            grad.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.ellipse(10, 5, 50, 40, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "rgba(255,255,255,0.9)";
            [[-8, -12, 7.5], [22, -20, 8.5], [40, 0, 7], [14, 18, 6.5], [38, 24, 5.5]].forEach(d => {
                ctx.beginPath(); ctx.arc(d[0], d[1], d[2], 0, Math.PI * 2); ctx.fill();
            });

            ctx.fillStyle = "#f5cd79";
            ctx.beginPath(); ctx.ellipse(-30, 14, 34, 28, 0, 0, Math.PI * 2); ctx.fill();

            [[-38, -6, -30, -28], [-20, -6, -14, -28]].forEach(pos => {
                ctx.strokeStyle = "#f5cd79"; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(pos[0], pos[1]); ctx.lineTo(pos[2], pos[3]); ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(pos[2], pos[3], 9.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#1e272e"; ctx.beginPath(); ctx.arc(pos[2] - 2, pos[3], 4.2, 0, Math.PI * 2); ctx.fill();
            });

            if (gameState === 'battle') {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(-55, -64, 120, 12);
                ctx.fillStyle = "#2ed573";
                ctx.fillRect(-53, -62, 116 * Math.max(0, enemy.hp / enemy.maxHp), 8);
            }

            ctx.restore();
        }

        // オニヨン（左側の回収基地）を描画
        function drawOnion() {
            ctx.save();
            ctx.translate(70, 170);
            // オニヨンの足
            ctx.strokeStyle = "#ffa502"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-20, 40); ctx.lineTo(-40, 70); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(20, 40); ctx.lineTo(40, 70); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(0, 75); ctx.stroke();
            // オニヨン本体（オレンジ色のUFO型）
            ctx.fillStyle = "#ff7f50";
            ctx.beginPath(); ctx.ellipse(0, 0, 38, 28, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ffa502";
            ctx.beginPath(); ctx.ellipse(0, -10, 25, 14, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function renderLoop(time) {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#081c14");
            grad.addColorStop(0.6, "#0e2e20");
            grad.addColorStop(1, "#184530");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(46, 213, 115, 0.07)";
            for (let i = 0; i < 22; i++) {
                ctx.beginPath();
                ctx.arc((i * 53) % canvas.width, (i * 97) % canvas.height, 20, 0, Math.PI * 2);
                ctx.fill();
            }

            // オニヨン描画
            drawOnion();

            // 待機中のピクミンたち
            if (gameState === 'battle') {
                squad.forEach(p => {
                    draw3DPikmin(p.x, p.y, p.color, 1.0, time * 0.008 + p.phase);
                });
            }

            // 運搬中のアニメーション処理
            if (gameState === 'carry') {
                // 生物が左（オニヨン方向）へ移動
                enemy.x -= 2.2;
                if (enemy.x < 110) {
                    enemy.alpha -= 0.05;
                    if (enemy.alpha <= 0) {
                        // 運搬完了！次のお題へ
                        gameState = 'battle';
                        enemy.x = 600;
                        enemy.alpha = 1.0;
                        nextWord();
                    }
                }
                // 周りのピクミンが一緒に移動
                carriers.forEach(c => {
                    draw3DPikmin(enemy.x + c.offsetX, enemy.y + c.offsetY, c.color, 1.0, time * 0.02);
                });
            }

            // 3D原生生物を描画
            draw3DEnemy(time);

            // 突撃ピクミンのアニメーション
            for (let i = attackers.length - 1; i >= 0; i--) {
                let a = attackers[i];
                a.progress += a.speed;
                let currX = a.x + (a.targetX - a.x) * a.progress;
                let currY = a.y + (a.targetY - a.y) * a.progress - Math.sin(a.progress * Math.PI) * 45;

                draw3DPikmin(currX, currY, a.color, 1.2, time * 0.03);

                if (a.progress >= 1.0) {
                    enemy.shake = a.crit ? 20 : 8;
                    popups.push({
                        x: enemy.x - 10 + (Math.random() - 0.5) * 35,
                        y: enemy.y - 40,
                        text: a.crit ? "CRITICAL!! +200" : "HIT!",
                        color: a.crit ? "#ffb142" : "#2ed573",
                        life: 40
                    });
                    attackers.splice(i, 1);
                }
            }

            for (let i = popups.length - 1; i >= 0; i--) {
                let pop = popups[i];
                pop.y -= 1.3;
                pop.life--;
                ctx.fillStyle = pop.color;
                ctx.font = "bold 17px sans-serif";
                ctx.fillText(pop.text, pop.x, pop.y);
                if (pop.life <= 0) popups.splice(i, 1);
            }

            animFrameId = requestAnimationFrame(renderLoop);
        }

        // ==========================================
        // 📚 お題・ゲームロジック
        // ==========================================
        const wordList = [
            { kanji: "チャッピー", kana: "ちゃっぴー", patterns: ["chappi", "tyappi", "cchappi"], color: "#d63031" },
            { kanji: "フタクチドックリ", kana: "ふたくちどっくり", patterns: ["futakuchidokkuri", "hutakutidokkuri"], color: "#636e72" },
            { kanji: "ブタドックリ", kana: "ぶたどっくり", patterns: ["butadokkuri"], color: "#e17055" },
            { kanji: "イモガエル", kana: "いもがえる", patterns: ["imogaeru"], color: "#fdcb6e" },
            { kanji: "ゲキカラスプレー", kana: "げきからすぷれー", patterns: ["gekikarasupure-", "gekikarasupure"], color: "#ff4757" },
            { kanji: "赤ピクミン", kana: "あかぴくみん", patterns: ["akapikumin", "akapikuminn"], color: "#ff5252" },
            { kanji: "青ピクミン", kana: "あおぴくみん", patterns: ["aopikumin", "aopikuminn"], color: "#1e90ff" },
            { kanji: "黄ピクミン", kana: "きぴくみん", patterns: ["kipikumin", "kipikuminn"], color: "#ffa502" },
            { kanji: "ドルフィン号", kana: "どるふぃんごう", patterns: ["dorufingou", "doruhwingou"], color: "#00cec9" },
            { kanji: "ペレット草", kana: "ぺれっとそう", patterns: ["perettosou"], color: "#2ed573" }
        ];

        let playMode = 'solo';
        let currentWord = null;
        let typedBuffer = "";
        let myPoints = 0;
        let aiPoints = 0;
        const GOAL = 1000;
        let aiTimer = null;
        let isGameActive = false;

        function startPlay(mode) {
            playMode = mode; myPoints = 0; aiPoints = 0; typedBuffer = ""; isGameActive = true;
            gameState = 'battle';
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            if (mode === 'ai') {
                document.getElementById('gameModeTitle').innerText = "🔥 ライバル対決：vs ルーイAI";
                document.getElementById('aiGaugeWrapper').classList.remove('hidden');
                startAi();
            } else {
                document.getElementById('gameModeTitle').innerText = "🌱 惑星探索：討伐ステージ";
                document.getElementById('aiGaugeWrapper').classList.add('hidden');
            }

            initSquad();
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(renderLoop);

            updateGauges();
            nextWord();
        }

        function backToHome() {
            isGameActive = false;
            clearInterval(aiTimer);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            updateHomeUI();
        }

        function nextWord() {
            if (!isGameActive) return;
            const idx = Math.floor(Math.random() * wordList.length);
            currentWord = wordList[idx];
            typedBuffer = "";
            enemy.name = currentWord.kanji;
            enemy.color = currentWord.color;
            enemy.hp = 100;
            enemy.maxHp = 100;
            enemy.alpha = 1.0;
            enemy.x = 600;

            document.getElementById('wordKanji').innerText = currentWord.kanji;
            document.getElementById('wordKana').innerText = currentWord.kana;
            updateRomanGuide("");
        }

        function updateRomanGuide(typed) {
            const guide = document.getElementById('romanGuide');
            if (!currentWord) return;
            const matchedPattern = currentWord.patterns.find(p => p.startsWith(typed)) || currentWord.patterns[0];
            let html = "";
            for (let i = 0; i < matchedPattern.length; i++) {
                if (i < typed.length && typed[i] === matchedPattern[i]) {
                    html += `<span class="typed-char">${matchedPattern[i]}</span>`;
                } else {
                    html += `<span class="untyped-char">${matchedPattern[i]}</span>`;
                }
            }
            guide.innerHTML = html;
        }

        // ==========================================
        // ⌨️ キーボード直接叩きリスナー
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if (!isGameActive || !currentWord || gameState !== 'battle') return;
            if (e.ctrlKey || e.altKey || e.metaKey || e.key.length > 1) return;

            const char = e.key.toLowerCase();
            const nextBuffer = typedBuffer + char;
            const fb = document.getElementById('feedbackMsg');

            const isValidPrefix = currentWord.patterns.some(p => p.startsWith(nextBuffer));
            const isExactMatch = currentWord.patterns.includes(nextBuffer);

            if (isExactMatch) {
                playHitSound();
                spawnAttack(true);
                enemy.hp = 0;

                myPoints += 200;
                currentUser.data.score += 200;
                currentUser.data.pikmin += 3;
                updateHomeUI();
                initSquad();

                fb.style.color = "var(--accent-green)";
                fb.innerText = `✨ 「${currentWord.kanji}」を撃破！ ピクミンが回収中...`;
                updateGauges();

                typedBuffer = "";
                
                if (myPoints >= GOAL) {
                    setTimeout(() => endGame(true), 600);
                } else {
                    // 撃破成功時に生物運搬アニメーションを開始！
                    startCarryingSequence();
                }
            } else if (isValidPrefix) {
                typedBuffer = nextBuffer;
                updateRomanGuide(typedBuffer);
                spawnAttack(false);

                const targetLen = currentWord.patterns[0].length;
                enemy.hp = Math.max(10, 100 - (typedBuffer.length / targetLen) * 90);

                fb.style.color = "var(--accent-green)";
                fb.innerText = "🌿 ピクミン突撃中！";
            } else {
                fb.style.color = "var(--accent-red)";
                fb.innerText = `⚠️ 違うキーです！ (${char.toUpperCase()})`;
            }
        });

        function startAi() {
            clearInterval(aiTimer);
            aiTimer = setInterval(() => {
                aiPoints += 110;
                updateGauges();
                if (aiPoints >= GOAL) { endGame(false); }
            }, 2600);
        }

        function updateGauges() {
            const p1Pct = Math.min(100, (myPoints / GOAL) * 100);
            document.getElementById('p1Bar').style.width = p1Pct + "%";
            document.getElementById('p1ScoreText').innerText = `${myPoints} / ${GOAL}`;
            const aiPct = Math.min(100, (aiPoints / GOAL) * 100);
            document.getElementById('aiBar').style.width = aiPct + "%";
            document.getElementById('aiScoreText').innerText = `${aiPoints} / ${GOAL}`;
        }

        function endGame(isWin) {
            isGameActive = false;
            clearInterval(aiTimer);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (playMode === 'ai') {
                if (isWin) {
                    currentUser.data.score += 500; currentUser.data.pikmin += 10; updateHomeUI();
                    alert("🏆 3D探索勝利！ ルーイAIに打ち勝った！");
                } else {
                    alert("💀 探索失敗... AIに先を越された！");
                }
            } else {
                currentUser.data.score += 300; updateHomeUI();
                alert("🎉 探索完了！ 惑星の原生生物を制圧しました！");
            }
            backToHome();
        }

        function playHitSound() {
            const audio = document.getElementById('hitSound');
            if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
        }
    </script>
</body>
</html>
