<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機捜210 - FULL SYSTEM CHASE TYPING</title>
    <style>
        :root {
            --bg-color: #02040a;
            --panel-bg: rgba(6, 12, 24, 0.94);
            --neon-cyan: #00f3ff;
            --neon-red: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 95%;
            max-width: 950px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--neon-cyan);
            text-shadow: 0 0 18px var(--neon-cyan);
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .auth-tab {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 18px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
        }

        .tab-btn.active {
            background: var(--neon-cyan);
            color: #000;
            font-weight: bold;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        input[type="text"], input[type="password"] {
            width: 80%;
            max-width: 380px;
            padding: 12px;
            background: #000;
            border: 2px solid var(--neon-cyan);
            color: #fff;
            font-size: 1.1rem;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 12px 26px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-shadow: 0 0 6px var(--neon-cyan);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateY(-2px);
        }

        button.red { color: var(--neon-red); border-color: var(--neon-red); }
        button.red:hover { background: var(--neon-red); color: #fff; }
        button.green { color: var(--neon-green); border-color: var(--neon-green); }
        button.green:hover { background: var(--neon-green); color: #000; }
        button.yellow { color: var(--neon-yellow); border-color: var(--neon-yellow); }
        button.yellow:hover { background: var(--neon-yellow); color: #000; }

        canvas {
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.5);
            margin: 15px 0;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--neon-cyan);
            margin-bottom: 10px;
            font-size: 1.0rem;
        }

        .hp-container {
            width: 140px;
            height: 14px;
            background: #222;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #555;
        }

        .hp-bar-player {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff66, #00f3ff);
            transition: width 0.2s ease;
        }

        .hp-bar-enemy {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-yellow));
            transition: width 0.2s ease;
        }

        .word-display-box {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 230, 0, 0.4);
            margin: 10px 0;
        }

        .target-word {
            font-size: 2.5rem;
            color: var(--neon-yellow);
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            font-weight: bold;
        }

        .typed-char { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        .roma-hint { color: #aaa; font-size: 1.3rem; margin-bottom: 5px; }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .shop-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .shop-card h3 { color: var(--neon-yellow); margin-bottom: 8px; }
        .shop-card p { color: #ccc; font-size: 0.95rem; margin-bottom: 12px; }

        .damage-flash { animation: dmgFlash 0.3s ease-out; }
        @keyframes dmgFlash {
            0% { background: rgba(255, 0, 85, 0.4); }
            100% { background: var(--panel-bg); }
        }
    </style>
</head>
<body>

    <div class="game-container" id="main-container">
        <!-- 1. ログイン / 新規登録 画面 -->
        <div id="login-screen" class="screen active">
            <h1>機捜210 AUTHENTICATION</h1>
            
            <div class="auth-tab">
                <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">ログイン</button>
                <button class="tab-btn" id="tab-register-btn" onclick="switchTab('register')">新規署員登録</button>
            </div>

            <!-- ログインフォーム -->
            <div id="login-form" class="auth-form">
                <input type="text" id="login-username" placeholder="捜査員コールサイン (名前)">
                <input type="password" id="login-password" placeholder="暗号パスワード">
                <button class="green" onclick="handleLogin()">ログイン出動</button>
            </div>

            <!-- 新規登録フォーム -->
            <div id="register-form" class="auth-form" style="display: none;">
                <input type="text" id="reg-username" placeholder="新規コールサイン (名前)">
                <input type="password" id="reg-password" placeholder="新規暗号パスワード">
                <button class="yellow" onclick="handleRegister()">新規登録して出動</button>
            </div>
        </div>

        <!-- 2. メニュー -->
        <div id="menu-screen" class="screen">
            <h1 id="user-display">捜査員待機中</h1>
            <canvas id="menu-canvas" width="900" height="220"></canvas>
            <div class="btn-group">
                <button class="green" onclick="startMode('free')">🟢 自由走行</button>
                <button class="red" onclick="startMode('mission')">🔴 メインミッション</button>
                <button class="yellow" onclick="startMode('ghost')">⚡ ゴースト対戦</button>
                <button style="border-color: #ff00ff; color: #ff00ff;" onclick="openShop()">🛒 ショップ</button>
                <button style="border-color: #aaa; color: #aaa;" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <!-- 3. ショップ画面 -->
        <div id="shop-screen" class="screen">
            <h1>装備カスタマイズ・ショップ</h1>
            <p style="color: var(--neon-yellow); font-size: 1.2rem; margin-bottom: 10px;" id="shop-money">所持資金: 0 G</p>

            <div class="shop-grid">
                <div class="shop-card">
                    <h3>エンジン強化</h3>
                    <p>打撃ダメージ・推進力アップ<br>(Lv.<span id="engine-lv">1</span>)</p>
                    <button class="yellow" onclick="buyUpgrade('engine')">強化 (<span id="engine-cost">100</span> G)</button>
                </div>
                <div class="shop-card">
                    <h3>車体カラー切替</h3>
                    <p>現在: <span id="car-color-name" style="color:var(--neon-cyan);">白黒クラウン</span></p>
                    <button onclick="toggleCarColor()">カラー変更</button>
                </div>
            </div>

            <button onclick="toMenu()">メニューに戻る</button>
        </div>

        <!-- 4. ゲーム画面 -->
        <div id="game-screen" class="screen">
            <div class="status-bar">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: var(--neon-green);">自機HP:</span>
                    <div class="hp-container"><div class="hp-bar-player" id="player-hp-bar"></div></div>
                </div>
                <span id="mode-title" style="color: var(--neon-yellow); font-weight: bold;">メインミッション</span>
                <div id="enemy-hp-box" style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: var(--neon-red);" id="progress-label">容疑車HP:</span>
                    <div class="hp-container"><div class="hp-bar-enemy" id="enemy-hp-bar"></div></div>
                </div>
                <span id="score-info">スコア: 0</span>
            </div>

            <canvas id="game-canvas" width="900" height="220"></canvas>

            <div class="word-display-box">
                <div class="roma-hint" id="roma-hint">keisatsu</div>
                <div class="target-word">
                    <span class="typed-char" id="typed-part"></span><span id="remain-part">keisatsu</span>
                </div>
            </div>

            <button onclick="toMenu()" style="padding: 6px 16px; font-size: 0.9rem;">メニューに戻る</button>
        </div>

        <!-- 5. リザルト -->
        <div id="result-screen" class="screen">
            <h1 id="result-title" style="color: var(--neon-green);">ミッション完了！</h1>
            <p id="result-detail" style="margin: 20px 0; font-size: 1.4rem; line-height: 1.8;"></p>
            <button onclick="toMenu()">メニューに戻る</button>
        </div>
    </div>

    <script>
        let player = null;
        let currentMode = "mission";
        let score = 0;
        let typedIdx = 0;
        let playerHp = 100;
        let enemyHp = 100;
        let ghostProgress = 0;
        let damageTimer = null;

        const wordList = [
            { jp: "けいさつ", roma: "keisatsu" },
            { jp: "ぱとかー", roma: "patoka-" },
            { jp: "さいれん", roma: "sairen" },
            { jp: "きんきゅう", roma: "kinkyuu" },
            { jp: "めんきょていし", roma: "menkyoteishi" },
            { jp: "ついせき", roma: "tsuiseki" },
            { jp: "たいほ", roma: "taiho" }
        ];
        let currentWord = {};
        let animId = null;
        let roadOffset = 0;

        function switchTab(type) {
            if (type === 'login') {
                document.getElementById('login-form').style.display = 'flex';
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('tab-login-btn').classList.add('active');
                document.getElementById('tab-register-btn').classList.remove('active');
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'flex';
                document.getElementById('tab-login-btn').classList.remove('active');
                document.getElementById('tab-register-btn').classList.add('active');
            }
        }

        function getUsersDB() {
            const db = localStorage.getItem("kisou210_full_db");
            return db ? JSON.parse(db) : {};
        }

        function saveUsersDB(db) {
            localStorage.setItem("kisou210_full_db", JSON.stringify(db));
        }

        function handleRegister() {
            const name = document.getElementById("reg-username").value.trim();
            const pass = document.getElementById("reg-password").value.trim();

            if (!name || !pass) return alert("コールサインとパスワードを入力してください！");

            const db = getUsersDB();
            if (db[name]) return alert("そのコールサインは既に登録されています！");

            db[name] = {
                name: name,
                password: pass,
                score: 0,
                level: 1,
                money: 0,
                engineLv: 1,
                carColor: "police"
            };
            saveUsersDB(db);

            player = db[name];
            alert(`新規捜査員 [${name}] の登録完了！`);
            onAuthSuccess();
        }

        function handleLogin() {
            const name = document.getElementById("login-username").value.trim();
            const pass = document.getElementById("login-password").value.trim();

            if (!name || !pass) return alert("コールサインとパスワードを入力してください！");

            const db = getUsersDB();
            if (!db[name]) return alert("登録されていない捜査員です。「新規署員登録」を行ってください。");
            if (db[name].password !== pass) return alert("パスワードが違います！");

            player = db[name];
            alert(`おかえりなさい、${name} 捜査員！認証成功。`);
            onAuthSuccess();
        }

        function onAuthSuccess() {
            document.getElementById("user-display").innerText = `捜査員: ${player.name} (Lv.${player.level})`;
            showScreen("menu-screen");
            startCanvasAnimation("menu-canvas");
        }

        function logout() {
            player = null;
            document.getElementById("login-username").value = "";
            document.getElementById("login-password").value = "";
            document.getElementById("reg-username").value = "";
            document.getElementById("reg-password").value = "";
            showScreen("login-screen");
        }

        function showScreen(id) {
            if (animId) cancelAnimationFrame(animId);
            if (damageTimer) clearInterval(damageTimer);
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        function toMenu() {
            window.removeEventListener("keydown", onKeyPress);
            showScreen("menu-screen");
            startCanvasAnimation("menu-canvas");
        }

        function openShop() {
            document.getElementById("shop-money").innerText = `所持資金: ${player.money} G`;
            document.getElementById("engine-lv").innerText = player.engineLv;
            document.getElementById("engine-cost").innerText = player.engineLv * 100;
            document.getElementById("car-color-name").innerText = player.carColor === "police" ? "白黒クラウン" : (player.carColor === "black" ? "覆面ブラック" : "ハイパーゴールド");
            showScreen("shop-screen");
        }

        function buyUpgrade(type) {
            if (type === 'engine') {
                let cost = player.engineLv * 100;
                if (player.money >= cost) {
                    player.money -= cost;
                    player.engineLv++;
                    savePlayerData();
                    openShop();
                    alert("エンジンを強化しました！");
                } else alert("資金が足りません！");
            }
        }

        function toggleCarColor() {
            const colors = ["police", "black", "gold"];
            let idx = (colors.indexOf(player.carColor) + 1) % colors.length;
            player.carColor = colors[idx];
            savePlayerData();
            openShop();
        }

        function savePlayerData() {
            const db = getUsersDB();
            db[player.name] = player;
            saveUsersDB(db);
        }

        function startMode(mode) {
            currentMode = mode;
            score = 0;
            playerHp = 100;
            enemyHp = 100;
            ghostProgress = 0;

            document.getElementById("enemy-hp-box").style.display = (mode === "free") ? "none" : "flex";
            document.getElementById("progress-label").innerText = (mode === "ghost") ? "ゴースト対戦:" : "容疑車HP:";
            document.getElementById("mode-title").innerText = mode === "mission" ? "🔴 メインミッション" : (mode === "free" ? "🟢 自由走行" : "⚡ ゴースト対戦");

            updateBars();
            showScreen("game-screen");
            startCanvasAnimation("game-canvas");
            nextWord();

            if (mode === "mission") {
                damageTimer = setInterval(() => {
                    playerHp -= 12;
                    updateBars();
                    const container = document.getElementById("main-container");
                    container.classList.remove("damage-flash");
                    void container.offsetWidth;
                    container.classList.add("damage-flash");

                    if (playerHp <= 0) endGame(false, "💥 パトカー大破...！ 💥\n容疑車両に逃走された！");
                }, 3500);
            }

            window.addEventListener("keydown", onKeyPress);
        }

        function updateBars() {
            document.getElementById("player-hp-bar").style.width = Math.max(0, playerHp) + "%";
            document.getElementById("enemy-hp-bar").style.width = Math.max(0, enemyHp) + "%";
        }

        function nextWord() {
            if (currentMode === "mission" && enemyHp <= 0) {
                endGame(true, "🚨 容疑車両の確保成功！ 🚨");
                return;
            }
            if (currentMode === "ghost" && enemyHp <= 0) {
                endGame(true, "⚡ ゴースト対戦勝利！ ⚡ ライバルを圧倒！");
                return;
            }

            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            typedIdx = 0;
            renderWord();
        }

        function endGame(isWin, title) {
            if (damageTimer) clearInterval(damageTimer);
            window.removeEventListener("keydown", onKeyPress);
            
            let reward = score + (isWin ? 150 : 30);
            player.money += reward;
            player.score += score;
            if (isWin) player.level++;
            savePlayerData();

            document.getElementById("result-title").innerText = title;
            document.getElementById("result-title").style.color = isWin ? "var(--neon-green)" : "var(--neon-red)";
            document.getElementById("result-detail").innerText = `獲得スコア: ${score} pt\n獲得賞金: ${reward} G\n現在のレベル: Lv.${player.level}`;
            showScreen("result-screen");
        }

        function renderWord() {
            document.getElementById("roma-hint").innerText = currentWord.roma;
            document.getElementById("typed-part").innerText = currentWord.roma.substring(0, typedIdx);
            document.getElementById("remain-part").innerText = currentWord.roma.substring(typedIdx);
            document.getElementById("score-info").innerText = `スコア: ${score}`;
        }

        function onKeyPress(e) {
            if (!document.getElementById("game-screen").classList.contains("active")) return;
            if (e.key.toLowerCase() === currentWord.roma[typedIdx]) {
                typedIdx++;
                score += 15;

                if (currentMode === "mission" || currentMode === "ghost") {
                    enemyHp -= (8 + player.engineLv * 2);
                    if (currentMode === "ghost") ghostProgress += 4;
                    updateBars();
                }

                renderWord();

                if (typedIdx >= currentWord.roma.length) {
                    setTimeout(nextWord, 100);
                }
            }
        }

        function startCanvasAnimation(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let frame = 0;

            function render() {
                frame++;
                roadOffset = (roadOffset + 14) % 60;
                ctx.fillStyle = "#030712";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#111827";
                ctx.fillRect(0, 110, canvas.width, 110);
                ctx.fillStyle = "#ffe600";
                for (let x = -roadOffset; x < canvas.width; x += 60) ctx.fillRect(x, 160, 35, 6);

                drawPatcar(ctx, 80, 130 + Math.sin(frame * 0.15) * 3, frame, player.carColor, player.name);

                if (canvasId === "game-canvas" && currentMode === "ghost") {
                    let ghostX = 120 + (ghostProgress * 5);
                    drawPatcar(ctx, Math.min(750, ghostX), 135, frame, "black", "GHOST");
                } else if (canvasId === "game-canvas" && currentMode === "mission") {
                    drawEnemyCar(ctx, 620, 135);
                } else if (canvasId === "menu-canvas") {
                    drawEnemyCar(ctx, 600, 135);
                }

                animId = requestAnimationFrame(render);
            }
            render();
        }

        function drawPatcar(ctx, x, y, frame, colorType, label) {
            ctx.save();
            let sirenRed = (Math.floor(frame / 6) % 2 === 0);
            ctx.shadowBlur = 15;
            ctx.shadowColor = sirenRed ? "#ff0055" : "#00f3ff";
            ctx.fillStyle = sirenRed ? "#ff0055" : "#00f3ff";
            ctx.fillRect(x + 45, y - 8, 25, 8);

            ctx.shadowBlur = 0;
            ctx.fillStyle = colorType === "gold" ? "#ffe600" : "#ffffff";
            ctx.fillRect(x + 25, y, 65, 22);

            ctx.fillStyle = colorType === "black" ? "#050505" : "#111111";
            ctx.fillRect(x, y + 20, 115, 24);

            if (label) {
                ctx.fillStyle = "#fff";
                ctx.font = "10px sans-serif";
                ctx.fillText(label, x + 10, y - 12);
            }

            ctx.fillStyle = "#333333";
            ctx.beginPath();
            ctx.arc(x + 25, y + 44, 10, 0, Math.PI * 2);
            ctx.arc(x + 90, y + 44, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemyCar(ctx, x, y) {
            ctx.save();
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(x, y + 16, 105, 24);
            ctx.fillStyle = "#222222";
            ctx.fillRect(x + 20, y, 55, 18);
            ctx.restore();
        }
    </script>
</body>
</html>
