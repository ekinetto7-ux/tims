<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機捜210 - DAMAGE CHASE TYPING</title>
    <style>
        :root {
            --bg-color: #02040a;
            --panel-bg: rgba(6, 12, 24, 0.94);
            --neon-cyan: #00f3ff;
            --neon-red: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 95%;
            max-width: 950px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--neon-cyan);
            text-shadow: 0 0 18px var(--neon-cyan);
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        input[type="text"] {
            width: 80%;
            max-width: 400px;
            padding: 14px;
            background: #000;
            border: 2px solid var(--neon-cyan);
            color: #fff;
            font-size: 1.2rem;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 12px 26px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-shadow: 0 0 6px var(--neon-cyan);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateY(-2px);
        }

        button.red { color: var(--neon-red); border-color: var(--neon-red); }
        button.red:hover { background: var(--neon-red); color: #fff; }
        button.green { color: var(--neon-green); border-color: var(--neon-green); }
        button.green:hover { background: var(--neon-green); color: #000; }
        button.yellow { color: var(--neon-yellow); border-color: var(--neon-yellow); }
        button.yellow:hover { background: var(--neon-yellow); color: #000; }

        canvas {
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.5);
            margin: 15px 0;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--neon-cyan);
            margin-bottom: 10px;
            font-size: 1.0rem;
        }

        .hp-container {
            width: 140px;
            height: 14px;
            background: #222;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #555;
        }

        .hp-bar-player {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff66, #00f3ff);
            transition: width 0.2s ease;
        }

        .hp-bar-enemy {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-yellow));
            transition: width 0.2s ease;
        }

        .word-display-box {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 230, 0, 0.4);
            margin: 10px 0;
        }

        .target-word {
            font-size: 2.5rem;
            color: var(--neon-yellow);
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.7);
            font-weight: bold;
        }

        .typed-char { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        .roma-hint { color: #aaa; font-size: 1.3rem; margin-bottom: 5px; }

        .spark-flash { animation: flash 0.1s ease-out; }
        @keyframes flash {
            0% { background: rgba(0, 243, 255, 0.25); }
            100% { background: var(--panel-bg); }
        }

        /* 被弾時の画面揺れ・赤フラッシュ */
        .damage-flash { animation: dmgFlash 0.3s ease-out; }
        @keyframes dmgFlash {
            0% { background: rgba(255, 0, 85, 0.4); }
            100% { background: var(--panel-bg); }
        }
    </style>
</head>
<body>

    <div class="game-container" id="main-container">
        <!-- 1. ログイン -->
        <div id="login-screen" class="screen active">
            <h1>機捜210 DAMAGE CHASE</h1>
            <p style="color: #aaa; margin-bottom: 10px;">コールサインを入力してログイン！</p>
            <input type="text" id="username" placeholder="コールサイン (例: 機捜210)"><br>
            <button onclick="login()">出動認証</button>
        </div>

        <!-- 2. メニュー -->
        <div id="menu-screen" class="screen">
            <h1 id="user-display">捜査員待機中</h1>
            <canvas id="menu-canvas" width="900" height="220"></canvas>
            <div class="btn-group">
                <button class="green" onclick="startMode('free')">🟢 自由走行</button>
                <button class="red" onclick="startMode('mission')">🔴 メインミッション (体当たり注意!)</button>
                <button class="yellow" onclick="startMode('ghost')">⚡ ゴースト対戦</button>
            </div>
        </div>

        <!-- 3. ゲーム画面 -->
        <div id="game-screen" class="screen">
            <div class="status-bar">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: var(--neon-green);">自機HP:</span>
                    <div class="hp-container"><div class="hp-bar-player" id="player-hp-bar"></div></div>
                </div>
                <span id="mode-title" style="color: var(--neon-yellow); font-weight: bold;">メインミッション</span>
                <div id="enemy-hp-box" style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: var(--neon-red);">容疑車HP:</span>
                    <div class="hp-container"><div class="hp-bar-enemy" id="enemy-hp-bar"></div></div>
                </div>
                <span id="score-info">スコア: 0</span>
            </div>

            <canvas id="game-canvas" width="900" height="220"></canvas>

            <div class="word-display-box">
                <div class="roma-hint" id="roma-hint">keisatsu</div>
                <div class="target-word">
                    <span class="typed-char" id="typed-part"></span><span id="remain-part">keisatsu</span>
                </div>
            </div>

            <button onclick="toMenu()" style="padding: 6px 16px; font-size: 0.9rem;">メニューに戻る</button>
        </div>

        <!-- 4. リザルト -->
        <div id="result-screen" class="screen">
            <h1 id="result-title" style="color: var(--neon-green);">ミッション完了！</h1>
            <p id="result-detail" style="margin: 20px 0; font-size: 1.4rem; line-height: 1.8;"></p>
            <button onclick="toMenu()">メニューに戻る</button>
        </div>
    </div>

    <script>
        let player = { name: "機捜210", score: 0, level: 1 };
        let currentMode = "mission";
        let score = 0;
        let typedIdx = 0;
        let playerHp = 100;
        let enemyHp = 100;
        let damageTimer = null; // 時間経過ダメージタイマー

        const wordList = [
            { jp: "けいさつ", roma: "keisatsu" },
            { jp: "ぱとかー", roma: "patoka-" },
            { jp: "さいれん", roma: "sairen" },
            { jp: "きんきゅう", roma: "kinkyuu" },
            { jp: "めんきょていし", roma: "menkyoteishi" },
            { jp: "ついせき", roma: "tsuiseki" },
            { jp: "たいほ", roma: "taiho" }
        ];
        let currentWord = {};
        let animId = null;
        let roadOffset = 0;

        function login() {
            const inputName = document.getElementById("username").value.trim();
            if (!inputName) return alert("名前を入力してください！");
            player.name = inputName;
            document.getElementById("user-display").innerText = `捜査員: ${player.name} (Lv.${player.level})`;
            showScreen("menu-screen");
            startCanvasAnimation("menu-canvas");
        }

        function showScreen(id) {
            if (animId) cancelAnimationFrame(animId);
            if (damageTimer) clearInterval(damageTimer);
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        function toMenu() {
            window.removeEventListener("keydown", onKeyPress);
            showScreen("menu-screen");
            startCanvasAnimation("menu-canvas");
        }

        function startMode(mode) {
            currentMode = mode;
            score = 0;
            playerHp = 100;
            enemyHp = 100;

            document.getElementById("enemy-hp-box").style.display = (mode === "free") ? "none" : "flex";
            document.getElementById("mode-title").innerText = mode === "mission" ? "🔴 メインミッション" : (mode === "free" ? "🟢 自由走行" : "⚡ ゴースト対戦");

            updateBars();
            showScreen("game-screen");
            startCanvasAnimation("game-canvas");
            nextWord();

            // 🔴 メインミッション時：3.5秒ごとに容疑者からダメージを受ける！
            if (mode === "mission") {
                damageTimer = setInterval(() => {
                    playerHp -= 12; // 時間経過で体当たりダメージ
                    updateBars();

                    // 画面を赤く光らせて被弾演出
                    const container = document.getElementById("main-container");
                    container.classList.remove("damage-flash");
                    void container.offsetWidth;
                    container.classList.add("damage-flash");

                    if (playerHp <= 0) {
                        endGame(false, "💥 パトカー大破...！ 💥\n容疑車両に逃走された！");
                    }
                }, 3500);
            }

            window.addEventListener("keydown", onKeyPress);
        }

        function updateBars() {
            document.getElementById("player-hp-bar").style.width = Math.max(0, playerHp) + "%";
            document.getElementById("enemy-hp-bar").style.width = Math.max(0, enemyHp) + "%";
        }

        function nextWord() {
            if (currentMode === "mission" && enemyHp <= 0) {
                endGame(true, "🚨 容疑車両の確保成功！ 🚨");
                return;
            }

            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            typedIdx = 0;
            renderWord();
        }

        function endGame(isWin, title) {
            if (damageTimer) clearInterval(damageTimer);
            window.removeEventListener("keydown", onKeyPress);
            if (isWin) player.level++;

            document.getElementById("result-title").innerText = title;
            document.getElementById("result-title").style.color = isWin ? "var(--neon-green)" : "var(--neon-red)";
            document.getElementById("result-detail").innerText = `獲得スコア: ${score} pt\n捜査官レベル: Lv.${player.level}`;
            showScreen("result-screen");
        }

        function renderWord() {
            document.getElementById("roma-hint").innerText = currentWord.roma;
            document.getElementById("typed-part").innerText = currentWord.roma.substring(0, typedIdx);
            document.getElementById("remain-part").innerText = currentWord.roma.substring(typedIdx);
            document.getElementById("score-info").innerText = `スコア: ${score}`;
        }

        function onKeyPress(e) {
            if (!document.getElementById("game-screen").classList.contains("active")) return;
            if (e.key.toLowerCase() === currentWord.roma[typedIdx]) {
                typedIdx++;
                score += 15;

                if (currentMode === "mission") {
                    enemyHp -= 10; // タイピング成功でダメージを与える
                    updateBars();
                }

                renderWord();

                if (typedIdx >= currentWord.roma.length) {
                    setTimeout(nextWord, 100);
                }
            }
        }

        function startCanvasAnimation(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let frame = 0;

            function render() {
                frame++;
                roadOffset = (roadOffset + 14) % 60;
                ctx.fillStyle = "#030712";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#111827";
                ctx.fillRect(0, 110, canvas.width, 110);
                ctx.fillStyle = "#ffe600";
                for (let x = -roadOffset; x < canvas.width; x += 60) ctx.fillRect(x, 160, 35, 6);

                drawPatcar(ctx, 80, 130 + Math.sin(frame * 0.15) * 3, frame);

                if (canvasId === "game-canvas" && currentMode === "mission") {
                    drawEnemyCar(ctx, 620, 135);
                } else if (canvasId === "menu-canvas") {
                    drawEnemyCar(ctx, 600, 135);
                }

                animId = requestAnimationFrame(render);
            }
            render();
        }

        function drawPatcar(ctx, x, y, frame) {
            ctx.save();
            let sirenRed = (Math.floor(frame / 6) % 2 === 0);
            ctx.shadowBlur = 15;
            ctx.shadowColor = sirenRed ? "#ff0055" : "#00f3ff";
            ctx.fillStyle = sirenRed ? "#ff0055" : "#00f3ff";
            ctx.fillRect(x + 45, y - 8, 25, 8);

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 25, y, 65, 22);

            ctx.fillStyle = "#111111";
            ctx.fillRect(x, y + 20, 115, 24);

            ctx.fillStyle = "#333333";
            ctx.beginPath();
            ctx.arc(x + 25, y + 44, 10, 0, Math.PI * 2);
            ctx.arc(x + 90, y + 44, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemyCar(ctx, x, y) {
            ctx.save();
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(x, y + 16, 105, 24);
            ctx.fillStyle = "#222222";
            ctx.fillRect(x + 20, y, 55, 18);
            ctx.restore();
        }
    </script>
</body>
</html>
