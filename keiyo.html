<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京葉線 E233系5000番台 メニュー</title>
    <style>
        :root {
            --keiyo-color: #c9222b; /* 京葉線ワインレッド */
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 路線マーク＆駅名標風ヘッダー */
        .header-station {
            background: #ffffff;
            border: 4px solid #737373;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .route-badge {
            background: var(--keiyo-color);
            color: #ffffff;
            width: 60px;
            height: 60px;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .route-badge .jr { font-size: 11px; line-height: 1; opacity: 0.9; }
        .route-badge .je { font-size: 28px; font-weight: 900; line-height: 1; }
        .header-station h1 { color: #222; font-size: 28px; margin: 5px 0 10px 0; font-weight: 900; }
        .line-bar { background: var(--keiyo-color); height: 12px; width: 100%; border-radius: 2px; }

        /* 🔙 ホームへ戻るボタン */
        .back-btn {
            display: inline-block;
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 25px;
            transition: background-color 0.2s;
        }
        .back-btn:hover { background-color: #e9ecef; }

        .menu-title {
            font-size: 18px;
            font-weight: bold;
            margin: 30px 0 15px 0;
            text-align: center;
        }

        /* 選択ボタンのデザイン */
        .select-link {
            display: block;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
            border-left: 8px solid var(--keiyo-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .select-link:hover {
            background: #fdf8f8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }
        .select-link span {
            display: block;
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ヘッダー -->
    <div class="header-station">
        <div class="route-badge"><span class="jr">JR</span><span class="je">JE</span></div>
        <h1>京葉線 E233系5000番台</h1>
        <div class="line-bar"></div>
    </div>

    <a href="index.html" class="back-btn">⬅ 総合ホーム画面へ戻る</a>

    <div class="menu-title">📋 見たい編成表のタイプを選択してください</div>

    <!-- 💡 ここで貫通と分割を選ばせます！ -->
    <a href="keiyo-kantsu.html" class="select-link">
        🟦 1. 貫通編成（10両固定編成）
        <span>ケヨ501〜ケヨ524編成（全24本）の車両番号を調べる</span>
    </a>

    <a href="keiyo-bunkatsu.html" class="select-link">
        🟥 2. 分割編成（4両＋6両編成）
        <span>外房・東金線直通のF51〜F54編成・ケヨ551〜554編成（全4ペア）を調べる</span>
    </a>

</div>

</body>
</html>
